[package]
name = "oslo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oslo"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []

# `diagnostics` — the caret under the word that was wrong. Forwarded to `oslo-base`, which is the
# only crate with code behind the flag: `diag_stub` mirrors every signature, so nothing else in the
# workspace needs a `cfg` and nothing else needs a feature to forward.
#
# Off by default like every other optional feature here, so `scripts/build.sh --minimal` leaves
# ariadne out of the binary entirely. A release is `--all-features` and has it.
diagnostics = ["oslo-base/diagnostics"]
vista = ["oslo-base/vista", "oslo-runtime/vista", "oslo-ui/vista"]

scratch = ["oslo-shell/scratch", "oslo-runtime/scratch"]

watch = ["oslo-shell/watch", "oslo-runtime/watch"]

direnv = ["oslo-shell/direnv", "oslo-runtime/direnv"]

# `make` — `.make.lua` recipes, the `oslo make` tool and the `make` builtin.
make = ["oslo-shell/make", "oslo-runtime/make"]

nix = ["oslo-shell/nix", "oslo-runtime/nix"]

# `math` — the calculator: units and dimensional analysis, as the `math` builtin and `oslo.math`.
math = ["oslo-shell/math", "oslo-runtime/math"]

plugin = ["oslo-runtime/plugin"]

argc = ["oslo-shell/argc", "oslo-runtime/argc", "dep:argc"]

# `compgen` — where completion data comes from. Carapace spec files today, read by name from
# `~/.config/oslo/specs`; the name is the category, not the format, so a second source can join it.
compgen = ["oslo-shell/compgen", "oslo-runtime/compgen"]

# `text` — the string verbs. See `oslo_shell::data::tools::text`.
text = ["oslo-shell/text"]

# `universal` — `set -U`: variables every session shares. See `oslo_shell::env::universal`.
universal = ["oslo-shell/universal", "oslo-runtime/universal"]

secrets = ["oslo-base/secrets", "oslo-runtime/secrets"]

crypt = ["secrets", "oslo-base/crypt"]

[dependencies]
argc = { path = "vendor/argc", default-features = false, features = [
    "eval", "eval-bash", "compgen",
], optional = true }
nix = { version = "0.29", features = [
    "process", "signal", "term", "fs", "user", "resource", "hostname", "poll",
] }
regex = { version = "1", default-features = false, features = [
    "std", "unicode-case", "unicode-perl",
    "perf-inline",
] }
serde_json = { version = "1", features = ["preserve_order"] }
which = "7.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"

oslo-base = { path = "crates/oslo-base" }
oslo-luavm = { path = "crates/oslo-luavm" }
oslo-runtime = { path = "crates/oslo-runtime" }
oslo-shell = { path = "crates/oslo-shell" }
oslo-ui = { path = "crates/oslo-ui" }
# The parser, for `oslo fmt` — the formatter is rune's, the command is oslo's. One pin for the
# whole tree; `oslo-shell` and `oslo-ui` name the same tag.
rune = { git = "https://github.com/onix-os/rune", tag = "v0.1.3" }
sha2 = "0.10"
tempfile = "3.17"

[dev-dependencies]
oslo-base = { path = "crates/oslo-base" }
oslo-ui = { path = "crates/oslo-ui" }

# **One version for the whole tree, in one place.** The crates had drifted into three — the binary
# at 0.4.x, four libraries at 0.2.x and two new ones at 0.1.0 — which says nothing true about any
# of them: they are released together, always, as one binary. Every manifest now inherits from
# here, so there is exactly one line in the repository that carries the number.
#
# The release tool bumps it by rewriting the `version = "…"` line it finds, and this is now the
# only one; `scripts/project-meta.sh` reads it the same way, falling back here when `[package]`
# inherits rather than states it.
[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace]
members = [
  "crates/oslo-base",
  "crates/oslo-luavm",
  "crates/oslo-math",
  "crates/oslo-runtime",
  "crates/oslo-shell",
  "crates/oslo-ui",
  "vendor/argc",
]

[[bench]]
name = "fuzzy"
path = "bench/fuzzy.rs"
harness = false

[[bench]]
name = "keystroke"
path = "bench/keystroke.rs"
harness = false

[[bench]]
name = "predict"
path = "bench/predict.rs"
harness = false
required-features = ["vista"]

[profile.release]
# **Unwinding is not needed and costs 820 KB.** It used to be: the history store could panic on a
# corrupt page, so every read and write went through `catch_unwind`. tagdata v0.1.4 validates a
# page pointer before following it and reports `InvalidDB` instead, and `.gcc_except_table` alone
# falls from 261 KB to 7 KB.
#
# **Three `catch_unwind` guards remain, and this setting makes all three inert.** They are written
# as isolation — a `.env.lua` that panics should not take the shell, a live-socket verb should
# answer rather than kill the server, one bad history record should cost one record — and under an
# abort none of them gets the chance. They are kept because a debug build and `cargo test` *do*
# unwind, so each still does its job where it can be exercised; what they must not be is mistaken
# for a guarantee in a release. The one consequence that actually reached a user — a panic behind
# the `.env.lua` redirect dying with a blank terminal — is handled by the panic hook in
# `oslo_ui::term::rescue`, which restores the descriptors and the terminal before the abort.
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"
# **Every crate at "z".** Both profiles built from the same source, shipped size (after `.make.lua`
# strips the unwind tables — measure before that and you are weighing 850 KB nobody ships):
#
#   shipped binary            5,666,432 at "s"   5,207,680 at "z"    -458,752  (-8.1%)
#   startup                   ~700 µs            ~700 µs             nothing
#   200,000-iteration loop    1.507 s            1.561 s             +3.6%
#   paint, per keystroke      5.42 µs            5.96 µs             +0.54 µs
#   hint, per keystroke       4.20 µs            4.83 µs             +0.63 µs
#
# **Startup is the one that had to be free**, and is: oslo is somebody's `bash`, so every
# `#!/usr/bin/env bash` script on the machine pays it. Compared by minima over repeated rounds, the
# sign flips between them — it is exec and page faults, not code speed.
#
# The keystroke cost is real and cannot be felt: +1.2 µs against the ~100 ms between two keys.
#
# The 3.6% is the one thing given up, and not where it looks. `oslo-shell` was already at "z" (see
# its note below), so it comes from this line and the dependencies under fat LTO. It is also next to
# nothing in context: bash runs that same loop in 293 ms against oslo's 1.5 s, so the interpreter is
# 5x behind for reasons no optimisation level reaches, and 3.6% of it is not the lever worth pulling.
#
# No per-package overrides any more, because there is nothing left to override: this line covers the
# workspace members and the one below covers their dependencies.
opt-level = "z"

[profile.release.package."*"]
opt-level = "z"
