[package]
name = "oslo-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oslo's interface layer: the line editor, completion, the dropdown, widgets, theming and the finder."

[dependencies]
# The syntax tree a highlighter walks, the error type, the feature bits, the hook registry and the
# tracking store the finder reads.
oslo-base = { path = "../oslo-base" }

# The terminal itself — termios, the pty, signals, polling for a keystroke.
nix = { version = "0.29", features = [
    "process", "signal", "term", "fs", "user", "poll",
] }

# Two questions the highlighter asks that ASCII cannot answer: where a grapheme ends, and how many
# columns one occupies. Both decide where the cursor goes, so both have to agree with the terminal.
unicode-segmentation = "1.12"
unicode-width = "0.2"

# The parser behind `syntax::classify`: is the line the user typed finished, unfinished, or wrong?
rune.workspace = true

# The syntax classifier, which asks the real parser whether a line is finished rather than
# guessing. Vendored; see `vendor/README.md`.

# `has`-style lookups from the completion side.
which = "7.0"
# The matcher behind Helix and, in shape, behind fzf: an optimal alignment rather than the greedy
# one this used to have, which is the difference between `cbf` reaching `cargo build --features`
# and it reaching nothing at all.
#
# **Measured, both ways.** `fuzzy-matcher` — skim's algorithm as a library — is the alternative and
# is two crates against nucleo's one; `nucleo` proper is the multi-threaded harness above this and
# is not what a list of four hundred rows needs. The binary paid 72 KB for the swap:
#
# ```text
#   the hand-written matcher   5,483,456
#   nucleo-matcher             5,557,216    +72 KB
# ```
#
# `matching.rs` is the only file that names it; the six widgets that filter — the finder, the
# manager, completion, `nav`, `ui choose` and `ui table` — all ask `Fuzzed` and did not change.
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile = "3.17"
oslo-base = { path = "../oslo-base" }
# Only the tests need an engine: a theme and a settings block are read from a `Value`, and the
# shortest way to build a realistic one is to run the config snippet that produces it.
oslo-luavm = { path = "../oslo-luavm" }

[features]
# Exposes `theme::held_at`, the guard that serialises tests asserting on colour escapes. The depth
# is one slot for the whole process and the tests that touch it are not all in this crate, so
# `cfg(test)` — which is set only while *this* crate's tests compile — cannot reach them all.
# `vista` — the model-backed ghost prediction and the repair hint drawn after the line. Off by
# default; without it the ghost comes from history, completions and paths alone.
vista = ["oslo-base/vista"]
