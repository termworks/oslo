[package]
name = "oslo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oslo's runtime: the Lua API a config is written against, the interpreter that owns it, and startup."
[features]
default = []
# `vista` — the model behind the ghost prediction, the correction hint and `oslo.repair`. Off by
# default; see the note on `oslo-base`.
vista = ["oslo-base/vista", "oslo-ui/vista"]
# `tab` — the key that opens the tab finder, and what it does with the answer. Off by default; see
# the note on `oslo-shell`.
scratch = ["oslo-shell/scratch"]
watch = ["oslo-shell/watch"]
# `direnv` — see the note on `oslo-shell`.
direnv = ["oslo-shell/direnv"]
# The calculator: `oslo.math` in Lua, and the `math` builtin the shell registers.
math = ["oslo-shell/math", "dep:oslo-math"]
# `argc` — see the note on `oslo-shell`.
argc = ["oslo-shell/argc"]
# `make` — see the note on `oslo-shell`.
make = ["oslo-shell/make"]
# `nix` — see the note on `oslo-shell`.
nix = ["oslo-shell/nix"]
# `compgen` — see the note on `oslo-shell`.
compgen = ["oslo-shell/compgen"]
# `universal` — see the note on `oslo-shell`. Here it is the per-prompt sync.
universal = ["oslo-shell/universal"]
# `secrets` — `oslo.secret`, the store from Lua. `dep:base64` is the Lua boundary for `seal` and
# `unseal`, which carry a whole age file: binary, and 45 KB cheaper than turning on age's armour.
secrets = ["oslo-base/secrets", "dep:base64"]

# `plugin` — the manifest, the index, and loading a plugin's Lua on first use. See the workspace
# root. Hashing is the trust gate — a plugin is loaded only while its files hash to what was allowed
# at install — and `sha2` is no longer optional for it, because `oslo.hash` is in every build.
plugin = []


[dependencies]
oslo-base = { path = "../oslo-base" }
oslo-luavm = { path = "../oslo-luavm" }
oslo-shell = { path = "../oslo-shell" }
oslo-math = { path = "../oslo-math", optional = true }
oslo-ui = { path = "../oslo-ui" }

# Terminal setup at startup and the signal handling the read loop installs.
nix = { version = "0.29", features = [
    "process", "signal", "term", "fs", "user", "poll", "socket",
] }

# `oslo.re`, and history's own matching.
regex = { version = "1", default-features = false, features = [
    "std", "unicode-case", "unicode-perl",
    "perf-inline",
] }

# `oslo.secret`'s seal/unseal, which hand a binary age file across the Lua boundary. Already in the
# tree as an unconditional dependency of vendored age, so this adds no crate.
base64 = { version = "0.22", optional = true }

# `oslo.json`.
# `preserve_order` keeps a document's own column order: without it `serde_json::Map` is a
# `BTreeMap`, so `from json` handed the record its fields alphabetised and `to text` printed them in
# an order matching neither the document nor its own header.
serde_json = { version = "1", features = ["preserve_order"] }

# The `plugin` trust gate hashes a plugin's files. Optional, so a build without the feature does not
# compile it at all.
sha2 = "0.10"

# Capturing an rc file's own output so it can be printed under the file that produced it.
tempfile = "3.17"

[dev-dependencies]
oslo-base = { path = "../oslo-base" }
oslo-ui = { path = "../oslo-ui" }
