[package]
name = "oslo-luavm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The Lua VM oslo runs on: luna."

[dependencies]
# A stackless Lua VM in pure Rust with a tracing garbage collector. No C, so a static musl build
# needs no C toolchain — the property the evaluator this replaced was written to keep.
#
# **Pinned to a tag, not a branch.** A branch would make the build depend on the day it ran: the
# same oslo revision would compile against whatever had landed that morning. A tag moves when
# somebody moves it, deliberately, and `cargo update` cannot move it at all.
#
# This was a commit hash while luna had no releases. The exact commit is recorded in `Cargo.lock`
# either way — so what the tag buys is a name a human can read in a diff. The flake pins the same
# tag's hash in `outputHashes`, and moves with it.
luna = { git = "https://github.com/onix-os/luna", tag = "v0.7.0" }
# The value type the shell speaks. The whole point of this crate is converting between the two.
oslo-base = { path = "../oslo-base" }

[features]
# `jit` — luna's cranelift tier: a hot Lua function is compiled to machine code on its own.
# Not forwarded by the root crate, so `--all-features` builds leave it out; `make build --type jit`
# turns it on.
jit = ["luna/jit"]
