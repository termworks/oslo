[package]
name = "oslo-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The bottom of oslo: the syntax tree, the error type, feature bits, the hook registry, and the tracking store."


[dependencies]
# The interpreter, for the two things down here that carry a Lua value: `ShellError::Lua` and the
# payload a hook is fired with. Both point downward — this crate names the Lua *evaluator*, never
# the Lua *API*, which sits at the top of the stack.

# `track` only. All engine access stays behind `track::kv`.
tagdata = { git = "https://github.com/robolibs/tagdata", tag = "v0.1.4", features = ["maintenance"] }
getrandom = "0.4"
# The predictor behind command prediction and repair. Pure Rust with no dependencies of its own,
# which is why it can be here at the bottom of the stack beside the history it reads.
#
# **Two of its four default features, and the two it does not get are measured rather than
# guessed.** On the static musl binary, against a 6,327,232-byte baseline: the crate itself costs
# 296 KB, `snapshot` 8 KB, `recent-cache` 36 KB, `surface-indexes` 100 KB and `explanations` 4 KB.
# `snapshot` is what keeps the model off the startup path and `recent-cache` is what makes a
# prediction follow what you are doing now, so both earn their bytes. `surface-indexes` only
# changes candidate generation inside `predict_aligned`, which is repair — nothing calls it yet,
# and 100 KB is too much to pay in advance of measuring what it buys — Phase 3 measured it and it
# still did not earn them. `explanations` answers why a prediction was made, which is a question a
# debugging tool asks and a ghost suggestion does not.
#
# **A tag, not a branch**, so a push upstream cannot change what oslo builds without an edit here.
# A tag rather than a raw commit because a release is the thing being depended on and `v0.1.2` says
# which one; `Cargo.lock` still pins the exact commit, so a tag moved upstream cannot change a build
# silently either. Named `vista` locally while the package is `vista-recall`, which is what keeps
# every `use vista::…` in this crate reading the way it did when the crate had one name.
vista = { package = "vista-recall", git = "https://github.com/bresilla/vista", tag = "v0.1.2", optional = true, default-features = false, features = [
    "snapshot",
    "recent-cache",
] }
sha2 = "0.10"

# The caret under the word that was wrong. See `src/diag.rs` for the one rule this obeys — a pipe
# sees what it always saw — and `PLAN.md` for the whole shape.
#
# **Two runtime dependencies and no build script**: `yansi`, which has none of its own, and
# `unicode-width`, which oslo already carries at the same major for the drawn table. `concolor` is
# ariadne's own tty-detection feature and is off: the shell already knows what a terminal is, and
# `diag::enabled` answers it once for the process rather than per report.
ariadne = { version = "0.6", optional = true, default-features = false }

# `track`'s query matching. Trimmed to the same feature set the shell uses, and for the same
# measured reasons — see the note in the root manifest.
regex = { version = "1", default-features = false, features = [
    "std", "unicode-case", "unicode-perl",
    "perf-inline",
] }

# `ShellError::Nix`, the hostname a session is recorded under, and `isatty` — which is how
# `track::nested` tells a terminal it can name from a pipe it cannot.
nix = { version = "0.29", features = ["hostname", "fs", "inotify", "user"] }


# The Lua boundary for a hook-backed store: a `Value::Str` is UTF-8 and an age file is not, so
# ciphertext crosses as base64. Already in the tree as an unconditional dependency of vendored age.
base64 = { version = "0.22", optional = true }

# The built-in mechanism, behind `crypt`: XChaCha20-Poly1305 and nothing else. The same AEAD `age`
# used for its payload, without the key exchange — which is what `age` as a *program* is for, named
# by a store that wants recipients. Eight packages against age's thirty-two.
chacha20poly1305 = { version = "0.11", optional = true, default-features = false, features = [
    "alloc",
] }

# The key model behind `crypt`: a secret you keep and recipients you publish. `x25519-dalek` is the
# exchange and `hkdf` turns a shared curve point into a key that may be used as one. `sha2` is
# already an unconditional dependency, so the hash costs nothing here.
x25519-dalek = { version = "3", optional = true, default-features = false, features = [
    "static_secrets",
] }
# 0.12 rather than 0.13: it is the generation that pairs with the `sha2 0.10` already here.
hkdf = { version = "0.12", optional = true }


[features]
default = []
# `diagnostics` — the caret. Off here and forwarded from the root, like every other optional
# feature in this tree: `scripts/build.sh --minimal` then leaves ariadne out of the binary, and
# `diag_stub` keeps every call site compiling with every message the one it always was.
diagnostics = ["dep:ariadne"]
# `vista` — the model behind ghost prediction and repair. Off, and the switch is here rather than
# in the shell because this is where the crate it needs is named: without the feature
# `vista-recall` is not compiled, not fetched, and not in the binary.
vista = ["dep:vista"]
# `secrets` — the filing: stores, names, the hooks, and the Lua boundary. No crypto of its own, so
# a store names an `encrypt`/`decrypt command` or a `crypto hook`.
secrets = ["dep:base64"]

# `crypt` — oslo's own built-in mechanism, so a fresh install encrypts without naming anything.
# Named for the job rather than for what implements it: what sits behind it is oslo's business and
# has changed before.
crypt = ["secrets", "dep:chacha20poly1305", "dep:x25519-dalek", "dep:hkdf"]
# Exposes the lock and the reset that serialise tests touching the process-wide feature bitset.
# Enabled by `oslo`'s dev-dependencies, so it is absent from any build that is not a test.

[dev-dependencies]
tempfile = "3.17"
libc = "0.2"
