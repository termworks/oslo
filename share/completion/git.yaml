      "--show-origin": "Augment the output of all queried config options with the origin type (file"
      "--show-scope": "Similar to --show-origin in that it augments the output of all queried config"
      "--get-colorbool=": "Find the color setting for name (e.g. color.diff) and output \"true\" or \"false"
      "--get-color=": "Find the color configured for name (e.g. color.diff.new) and output it as the"
      "-e, --edit": "Opens an editor to modify the specified config file; either --system, --globa"
      "--includes": "Respect include.* directives in config files when looking up values. Defaults"
      "--no-includes": "Respect include.* directives in config files when looking up values. Defaults"
      "--default?": "When using --get, and the requested variable is not found, behave as if were"
    completion:
      flag:
        local: ["user.name\tSet config for username", "user.email\tSet config for email"]
        file: ["$files"]
        type: [bool, int, bool-or-int, path, expiry-date, color]
      positional:
        - ["add.ignore-errors\tTells 'git add' to continue adding files when some files cannot be added due to indexing errors. Equivalent to the `--ignore-errors` option of git-add[1]. `add.ignore-errors` is deprecated, as it does not follow the usual naming convention for configuration variables", "add.interactive.useBuiltin\tSet to `false` to fall back to the original Perl implementation of the interactive version of git-add[1] instead of the built-in version. Is `true` by default", "advice.addEmbeddedRepo\tAdvice on what to do when you've accidentally added one git repo inside of another", "advice.addEmptyPathspec\tAdvice shown if a user runs the add command without providing the pathspec parameter", "advice.addIgnoredFile\tAdvice shown if a user attempts to add an ignored file to the index", "advice.ambiguousFetchRefspec\tAdvice shown when fetch refspec for multiple remotes map to the same remote-tracking branch namespace and causes branch tracking set-up to fail", "advice.amWorkDir\tAdvice that shows the location of the patch file when git-am[1] fails to apply it", "advice.checkoutAmbiguousRemoteBranchName\tAdvice shown when the argument to git-checkout[1] and git-switch[1] ambiguously resolves to a remote tracking branch on more than one remote in situations where an unambiguous argument would have otherwise caused a remote-tracking branch to be checked out. See the `checkout.defaultRemote` configuration variable for how to set a given remote to used by default in some situations where this advice would be printed", "advice.commitBeforeMerge\tAdvice shown when git-merge[1] refuses to merge to avoid overwriting local changes", "advice.detachedHead\tAdvice shown when you used git-switch[1] or git-checkout[1] to move to the detach HEAD state, to instruct how to create a local branch after the fact", "advice.fetchShowForcedUpdates\tAdvice shown when git-fetch[1] takes a long time to calculate forced updates after ref updates, or to warn that the check is disabled", "advice.ignoredHook\tAdvice shown if a hook is ignored because the hook is not set as executable", "advice.implicitIdentity\tAdvice on how to set your identity configuration when your information is guessed from the system username and domain name", "advice.nestedTag\tAdvice shown if a user attempts to recursively tag a tag object", "advice.pushAlreadyExists\tShown when git-push[1] rejects an update that does not qualify for fast-forwarding (e.g., a tag.)", "advice.pushFetchFirst\tShown when git-push[1] rejects an update that tries to overwrite a remote ref that points at an object we do not have", "advice.pushNeedsForce\tShown when git-push[1] rejects an update that tries to overwrite a remote ref that points at an object that is not a commit-ish, or make the remote ref point at an object that is not a commit-ish", "advice.pushNonFFCurrent\tAdvice shown when git-push[1] fails due to a non-fast-forward update to the current branch", "advice.pushNonFFMatching\tAdvice shown when you ran git-push[1] and pushed 'matching refs' explicitly (i.e. you used ':', or specified a refspec that isn't your current branch) and it resulted in a non-fast-forward error", "advice.pushRefNeedsUpdate\tShown when git-push[1] rejects a forced update of a branch when its remote-tracking ref has updates that we do not have locally", "advice.pushUnqualifiedRefname\tShown when git-push[1] gives up trying to guess based on the source and destination refs what remote ref namespace the source belongs in, but where we can still suggest that the user push to either refs/heads/* or refs/tags/* based on the type of the source object", "advice.pushUpdateRejected\tSet this variable to 'false' if you want to disable 'pushNonFFCurrent', 'pushNonFFMatching', 'pushAlreadyExists', 'pushFetchFirst', 'pushNeedsForce', and 'pushRefNeedsUpdate' simultaneously", "advice.resetNoRefresh\tAdvice to consider using the `--no-refresh` option to git-reset[1] when the command takes more than 2 seconds to refresh the index after reset", "advice.resolveConflict\tAdvice shown by various commands when conflicts prevent the operation from being performed", "advice.rmHints\tIn case of failure in the output of git-rm[1], show directions on how to proceed from the current state", "advice.sequencerInUse\tAdvice shown when a sequencer command is already in progress", "advice.skippedCherryPicks\tShown when git-rebase[1] skips a commit that has already been cherry-picked onto the upstream branch", "advice.statusAheadBehind\tShown when git-status[1] computes the ahead/behind counts for a local ref compared to its remote tracking ref, and that calculation takes longer than expected. Will not appear if `status.aheadBehind` is false or the option `--no-ahead-behind` is given", "advice.statusHints\tShow directions on how to proceed from the current state in the output of git-status[1], in the template shown when writing commit messages in git-commit[1], and in the help message shown by git-switch[1] or git-checkout[1] when switching branch", "advice.statusUoption\tAdvise to consider using the `-u` option to git-status[1] when the command takes more than 2 seconds to enumerate untracked files", "advice.submoduleAlternateErrorStrategyDie\tAdvice shown when a submodule.alternateErrorStrategy option configured to \"die\" causes a fatal error", "advice.submodulesNotUpdated\tAdvice shown when a user runs a submodule command that fails because `git submodule update --init` was not run", "advice.suggestDetachingHead\tAdvice shown when git-switch[1] refuses to detach HEAD without the explicit `--detach` option", "advice.updateSparsePath\tAdvice shown when either git-add[1] or git-rm[1] is asked to update index entries outside the current sparse checkout", "advice.waitingForEditor\tPrint a message to the terminal whenever Git is waiting for editor input from the user", "alias.*\tCommand aliases for the git[1] command wrapper - e.g. after defining `alias.last = cat-file commit HEAD`, the invocation `git last` is equivalent to `git cat-file commit HEAD`. To avoid confusion and troubles with script usage, aliases that hide existing Git commands are ignored. Arguments are split by spaces, the usual shell quoting and escaping is supported. A quote pair or a backslash can be used to quote them", "am.keepcr\tIf true, git-am will call git-mailsplit for patches in mbox format with parameter `--keep-cr`. In this case git-mailsplit will not remove `\\r` from lines ending with `\\r\\n`. Can be overridden by giving `--no-keep-cr` from the command line. See git-am[1], git-mailsplit[1]", "am.threeWay\tBy default, `git am` will fail if the patch does not apply cleanly. When set to true, this setting tells `git am` to fall back on 3-way merge if the patch records the identity of blobs it is supposed to apply to and we have those blobs available locally (equivalent to giving the `--3way` option from the command line). Defaults to `false`. See git-am[1]", "apply.ignoreWhitespace\tWhen set to 'change', tells 'git apply' to ignore changes in whitespace, in the same way as the `--ignore-space-change` option. When set to one of: no, none, never, false tells 'git apply' to respect all whitespace differences. See git-apply[1]", "apply.whitespace\tTells 'git apply' how to handle whitespaces, in the same way as the `--whitespace` option. See git-apply[1]", "blame.blankBoundary\tShow blank commit object name for boundary commits in git-blame[1]. This option defaults to false", "blame.coloring\tThis determines the coloring scheme to be applied to blame output. It can be 'repeatedLines', 'highlightRecent', or 'none' which is the default", "blame.date\tSpecifies the format used to output dates in git-blame[1]. If unset the iso format is used. For supported values, see the discussion of the `--date` option at git-log[1]", "blame.ignoreRevsFile\tIgnore revisions listed in the file, one unabbreviated object name per line, in git-blame[1]. Whitespace and comments beginning with `#` are ignored. This option may be repeated multiple times. Empty file names will reset the list of ignored revisions. This option will be handled before the command line option `--ignore-revs-file`", "blame.markIgnoredLines\tMark lines that were changed by an ignored revision that we attributed to another commit with a '?' in the output of git-blame[1]", "blame.markUnblamableLines\tMark lines that were changed by an ignored revision that we could not attribute to another commit with a '*' in the output of git-blame[1]", "blame.showEmail\tShow the author email instead of author name in git-blame[1]. This option defaults to false", "blame.showRoot\tDo not treat root commits as boundaries in git-blame[1]. This option defaults to false", "branch.<name>.description\tBranch description, can be edited with `git branch --edit-description`. Branch description is automatically added in the format-patch cover letter or request-pull summary", "branch.<name>.merge\tDefines, together with branch.<name>.remote, the upstream branch for the given branch. It tells 'git fetch'/'git pull'/'git rebase' which branch to merge and can also affect 'git push' (see push.default). When in branch <name>, it tells 'git fetch' the default refspec to be marked for merging in FETCH_HEAD. The value is handled like the remote part of a refspec, and must match a ref which is fetched from the remote given by \"branch.<name>.remote\". The merge information is used by 'git pull' (which at first calls 'git fetch') to lookup the default branch for merging. Without this option, 'git pull' defaults to merge the first refspec fetched. Specify multiple values to get an octopus merge. If you wish to setup 'git pull' so that it merges into <name> from another branch in the local repository, you can point branch.<name>.merge to the desired branch, and use the relative path setting `.` (a period) for branch.<name>.remote", "branch.<name>.mergeOptions\tSets default options for merging into branch <name>. The syntax and supported options are the same as those of git-merge[1], but option values containing whitespace characters are currently not supported", "branch.<name>.pushRemote\tWhen on branch <name>, it overrides `branch.<name>.remote` for pushing. It also overrides `remote.pushDefault` for pushing from branch <name>. When you pull from one place (e.g. your upstream) and push to another place (e.g. your own publishing repository), you would want to set `remote.pushDefault` to specify the remote to push to for all branches, and use this option to override it for a specific branch", "branch.<name>.rebase\tWhen true, rebase the branch <name> on top of the fetched branch, instead of merging the default branch from the default remote when \"git pull\" is run. See \"pull.rebase\" for doing this in a non branch-specific manner", "branch.<name>.remote\tWhen on branch <name>, it tells 'git fetch' and 'git push' which remote to fetch from/push to. The remote to push to may be overridden with `remote.pushDefault` (for all branches). The remote to push to, for the current branch, may be further overridden by `branch.<name>.pushRemote`. If no remote is configured, or if you are not on any branch and there is more than one remote defined in the repository, it defaults to `origin` for fetching and `remote.pushDefault` for pushing. Additionally, `.` (a period) is the current local repository (a dot-repository), see `branch.<name>.merge`'s final note below", "branch.autoSetupMerge\tTells 'git branch', 'git switch' and 'git checkout' to set up new branches so that git-pull[1] will appropriately merge from the starting point branch. Note that even if this option is not set, this behavior can be chosen per-branch using the `--track` and `--no-track` options. The valid settings are: `false` -- no automatic setup is done; `true` -- automatic setup is done when the starting point is a remote-tracking branch; `always` -- automatic setup is done when the starting point is either a local branch or remote-tracking branch; `inherit` -- if the starting point has a tracking configuration, it is copied to the new branch; `simple` -- automatic setup is done only when the starting point is a remote-tracking branch and the new branch has the same name as the remote branch. This option defaults to true", "branch.autoSetupRebase\tWhen a new branch is created with 'git branch', 'git switch' or 'git checkout' that tracks another branch, this variable tells Git to set up pull to rebase instead of merge (see \"branch.<name>.rebase\"). When `never`, rebase is never automatically set to true. When `local`, rebase is set to true for tracked branches of other local branches. When `remote`, rebase is set to true for tracked branches of remote-tracking branches. When `always`, rebase will be set to true for all tracking branches. See \"branch.autoSetupMerge\" for details on how to set up a branch to track another branch. This option defaults to never", "branch.sort\tThis variable controls the sort ordering of branches when displayed by git-branch[1]. Without the \"--sort=<value>\" option provided, the value of this variable will be used as the default. See git-for-each-ref[1] field names for valid values", "browser.<tool>.cmd\tSpecify the command to invoke the specified browser. The specified command is evaluated in shell with the URLs passed as arguments. (See git-web{litdd}browse[1].)", "browser.<tool>.path\tOverride the path for the given tool that may be used to browse HTML help (see `-w` option in git-help[1]) or a working repository in gitweb (see git-instaweb[1])", "checkout.defaultRemote\tWhen you run `git checkout <something>` or `git switch <something>` and only have one remote, it may implicitly fall back on checking out and tracking e.g. `origin/<something>`. This stops working as soon as you have more than one remote with a `<something>` reference. This setting allows for setting the name of a preferred remote that should always win when it comes to disambiguation. The typical use-case is to set this to `origin`", "checkout.guess\tProvides the default value for the `--guess` or `--no-guess` option in `git checkout` and `git switch`. See git-switch[1] and git-checkout[1]", "checkout.thresholdForParallelism\tWhen running parallel checkout with a small number of files, the cost of subprocess spawning and inter-process communication might outweigh the parallelization gains. This setting allows to define the minimum number of files for which parallel checkout should be attempted. The default is 100", "checkout.workers\tThe number of parallel workers to use when updating the working tree. The default is one, i.e. sequential execution. If set to a value less than one, Git will use as many workers as the number of logical cores available. This setting and `checkout.thresholdForParallelism` affect all commands that perform checkout. E.g. checkout, clone, reset, sparse-checkout, etc", "clean.requireForce\tA boolean to make git-clean do nothing unless given -f, -i or -n. Defaults to true", "clone.defaultRemoteName\tThe name of the remote to create when cloning a repository. Defaults to `origin`, and can be overridden by passing the `--origin` command-line option to git-clone[1]", "clone.filterSubmodules\tIf a partial clone filter is provided (see `--filter` in git-rev-list[1]) and `--recurse-submodules` is used, also apply the filter to submodules", "clone.rejectShallow\tReject to clone a repository if it is a shallow one, can be overridden by passing option `--reject-shallow` in command line. See git-clone[1]", "color.advice\tA boolean to enable/disable color in hints (e.g. when a push failed, see `advice.*` for a list). May be set to `always`, `false` (or `never`) or `auto` (or `true`), in which case colors are used only when the error output goes to a terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.advice.hint\tUse customized color for hints", "color.blame.highlightRecent\tSpecify the line annotation color for `git blame --color-by-age` depending upon the age of the line", "color.blame.repeatedLines\tUse the specified color to colorize line annotations for `git blame --color-lines`, if they come from the same commit as the preceding line. Defaults to cyan", "color.branch\tA boolean to enable/disable color in the output of git-branch[1]. May be set to `always`, `false` (or `never`) or `auto` (or `true`), in which case colors are used only when the output is to a terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.branch.<slot>\tUse customized color for branch coloration. `<slot>` is one of `current` (the current branch), `local` (a local branch), `remote` (a remote-tracking branch in refs/remotes/), `upstream` (upstream tracking branch), `plain` (other refs)", "color.decorate.<slot>\tUse customized color for 'git log --decorate' output. `<slot>` is one of `branch`, `remoteBranch`, `tag`, `stash` or `HEAD` for local branches, remote-tracking branches, tags, stash and HEAD, respectively and `grafted` for grafted commits", "color.diff\tWhether to use ANSI escape sequences to add color to patches. If this is set to `always`, git-diff[1], git-log[1], and git-show[1] will use color for all patches. If it is set to `true` or `auto`, those commands will only use color when output is to the terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.diff.<slot>\tUse customized color for diff colorization. `<slot>` specifies which part of the patch to use the specified color, and is one of `context` (context text - `plain` is a historical synonym), `meta` (metainformation), `frag` (hunk header), 'func' (function in hunk header), `old` (removed lines), `new` (added lines), `commit` (commit headers), `whitespace` (highlighting whitespace errors), `oldMoved` (deleted lines), `newMoved` (added lines), `oldMovedDimmed`, `oldMovedAlternative`, `oldMovedAlternativeDimmed`, `newMovedDimmed`, `newMovedAlternative` `newMovedAlternativeDimmed` (See the '<mode>' setting of '--color-moved' in git-diff[1] for details), `contextDimmed`, `oldDimmed`, `newDimmed`, `contextBold`, `oldBold`, and `newBold` (see git-range-diff[1] for details)", "color.grep\tWhen set to `always`, always highlight matches. When `false` (or `never`), never. When set to `true` or `auto`, use color only when the output is written to the terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.grep.<slot>\tUse customized color for grep colorization. `<slot>` specifies which part of the line to use the specified color, and is one of", "color.interactive\tWhen set to `always`, always use colors for interactive prompts and displays (such as those used by \"git-add --interactive\" and \"git-clean --interactive\"). When false (or `never`), never. When set to `true` or `auto`, use colors only when the output is to the terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.interactive.<slot>\tUse customized color for 'git add --interactive' and 'git clean --interactive' output. `<slot>` may be `prompt`, `header`, `help` or `error`, for four distinct types of normal output from interactive commands", "color.pager\tA boolean to specify whether `auto` color modes should colorize output going to the pager. Defaults to true; set this to false if your pager does not understand ANSI color codes", "color.push\tA boolean to enable/disable color in push errors. May be set to `always`, `false` (or `never`) or `auto` (or `true`), in which case colors are used only when the error output goes to a terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.push.error\tUse customized color for push errors", "color.remote\tIf set, keywords at the start of the line are highlighted. The keywords are \"error\", \"warning\", \"hint\" and \"success\", and are matched case-insensitively. May be set to `always`, `false` (or `never`) or `auto` (or `true`). If unset, then the value of `color.ui` is used (`auto` by default)", "color.remote.<slot>\tUse customized color for each remote keyword. `<slot>` may be `hint`, `warning`, `success` or `error` which match the corresponding keyword", "color.showBranch\tA boolean to enable/disable color in the output of git-show-branch[1]. May be set to `always`, `false` (or `never`) or `auto` (or `true`), in which case colors are used only when the output is to a terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.status\tA boolean to enable/disable color in the output of git-status[1]. May be set to `always`, `false` (or `never`) or `auto` (or `true`), in which case colors are used only when the output is to a terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.status.<slot>\tUse customized color for status colorization. `<slot>` is one of `header` (the header text of the status message), `added` or `updated` (files which are added but not committed), `changed` (files which are changed but not added in the index), `untracked` (files which are not tracked by Git), `branch` (the current branch), `nobranch` (the color the 'no branch' warning is shown in, defaulting to red), `localBranch` or `remoteBranch` (the local and remote branch names, respectively, when branch and tracking information is displayed in the status short-format), or `unmerged` (files which have unmerged changes)", "color.transport\tA boolean to enable/disable color when pushes are rejected. May be set to `always`, `false` (or `never`) or `auto` (or `true`), in which case colors are used only when the error output goes to a terminal. If unset, then the value of `color.ui` is used (`auto` by default)", "color.transport.rejected\tUse customized color when a push was rejected", "color.ui\tThis variable determines the default value for variables such as `color.diff` and `color.grep` that control the use of color per command family. Its scope will expand as more commands learn configuration to set a default for the `--color` option. Set it to `false` or `never` if you prefer Git commands not to use color unless enabled explicitly with some other configuration or the `--color` option. Set it to `always` if you want all output not intended for machine consumption to use color, to `true` or `auto` (this is the default since Git 1.8.4) if you want such output to use color when written to the terminal", "column.branch\tSpecify whether to output branch listing in `git branch` in columns. See `column.ui` for details", "column.clean\tSpecify the layout when list items in `git clean -i`, which always shows files and directories in columns. See `column.ui` for details", "column.status\tSpecify whether to output untracked files in `git status` in columns. See `column.ui` for details", "column.tag\tSpecify whether to output tag listing in `git tag` in columns. See `column.ui` for details", "column.ui\tSpecify whether supported commands should output in columns. This variable consists of a list of tokens separated by spaces or commas:", "commit.cleanup\tThis setting overrides the default of the `--cleanup` option in `git commit`. See git-commit[1] for details. Changing the default can be useful when you always want to keep lines that begin with comment character `#` in your log message, in which case you would do `git config commit.cleanup whitespace` (note that you will have to remove the help lines that begin with `#` in the commit log template yourself, if you do this)", "commit.status\tA boolean to enable/disable inclusion of status information in the commit message template when using an editor to prepare the commit message. Defaults to true", "commit.template\tSpecify the pathname of a file to use as the template for new commit messages", "commit.verbose\tA boolean or int to specify the level of verbose with `git commit`. See git-commit[1]", "commitGraph.generationVersion\tSpecifies the type of generation number version to use when writing or reading the commit-graph file. If version 1 is specified, then the corrected commit dates will not be written or read. Defaults to 2", "commitGraph.maxNewFilters\tSpecifies the default value for the `--max-new-filters` option of `git commit-graph write` (c.f., git-commit-graph[1])", "commitGraph.readChangedPaths\tIf true, then git will use the changed-path Bloom filters in the commit-graph file (if it exists, and they are present). Defaults to true. See git-commit-graph[1] for more information", "committer.email\tThe `user.name` and `user.email` variables determine what ends up in the `author` and `committer` field of commit objects. If you need the `author` or `committer` to be different, the `author.name`, `author.email`, `committer.name` or `committer.email` variables can be set. Also, all of these can be overridden by the `GIT_AUTHOR_NAME`, `GIT_AUTHOR_EMAIL`, `GIT_COMMITTER_NAME`, `GIT_COMMITTER_EMAIL` and `EMAIL` environment variables", "completion.commands\tThis is only used by git-completion.bash to add or remove commands from the list of completed commands. Normally only porcelain commands and a few select others are completed. You can add more commands, separated by space, in this variable. Prefixing the command with '-' will remove it from the existing list", "core.abbrev\tSet the length object names are abbreviated to. If unspecified or set to \"auto\", an appropriate value is computed based on the approximate number of packed objects in your repository, which hopefully is enough for abbreviated object names to stay unique for some time. If set to \"no\", no abbreviation is made and the object names are shown in their full length. The minimum length is 4", "core.alternateRefsCommand\tWhen advertising tips of available history from an alternate, use the shell to execute the specified command instead of git-for-each-ref[1]. The first argument is the absolute path of the alternate. Output must contain one hex object id per line (i.e., the same as produced by `git for-each-ref --format='%(objectname)'`)", "core.alternateRefsPrefixes\tWhen listing references from an alternate, list only references that begin with the given prefix. Prefixes match as if they were given as arguments to git-for-each-ref[1]. To list multiple prefixes, separate them with whitespace. If `core.alternateRefsCommand` is set, setting `core.alternateRefsPrefixes` has no effect", "core.askPass\tSome commands (e.g. svn and http interfaces) that interactively ask for a password can be told to use an external program given via the value of this variable. Can be overridden by the `GIT_ASKPASS` environment variable. If not set, fall back to the value of the `SSH_ASKPASS` environment variable or, failing that, a simple password prompt. The external program shall be given a suitable prompt as command-line argument and write the password on its STDOUT", "core.attributesFile\tIn addition to `.gitattributes` (per-directory) and `.git/info/attributes`, Git looks into this file for attributes (see gitattributes[5]). Path expansions are made the same way as for `core.excludesFile`. Its default value is `$XDG_CONFIG_HOME/git/attributes`. If `$XDG_CONFIG_HOME` is either not set or empty, `$HOME/.config/git/attributes` is used instead", "core.autocrlf\tSetting this variable to \"true\" is the same as setting the `text` attribute to \"auto\" on all files and core.eol to \"crlf\". Set to true if you want to have `CRLF` line endings in your working directory and the repository has LF line endings. This variable can be set to 'input', in which case no output conversion is performed", "core.bare\tIf true this repository is assumed to be 'bare' and has no working directory associated with it. If this is the case a number of commands that require a working directory will be disabled, such as git-add[1] or git-merge[1]", "core.bigFileThreshold\tThe size of files considered \"big\", which as discussed below changes the behavior of numerous git commands, as well as how such files are stored within the repository. The default is 512 MiB. Common unit suffixes of 'k', 'm', or 'g' are supported", "core.checkRoundtripEncoding\tA comma and/or whitespace separated list of encodings that Git performs UTF-8 round trip checks on if they are used in an `working-tree-encoding` attribute (see gitattributes[5]). The default value is `SHIFT-JIS`", "core.checkStat\tWhen missing or is set to `default`, many fields in the stat structure are checked to detect if a file has been modified since Git looked at it. When this configuration variable is set to `minimal`, sub-second part of mtime and ctime, the uid and gid of the owner of the file, the inode number (and the device number, if Git was compiled to use it), are excluded from the check among these fields, leaving only the whole-second part of mtime (and ctime, if `core.trustCtime` is set) and the filesize to be checked", "core.commentChar\tCommands such as `commit` and `tag` that let you edit messages consider a line that begins with this character commented, and removes them after the editor returns (default '#')", "core.commitGraph\tIf true, then git will read the commit-graph file (if it exists) to parse the graph structure of commits. Defaults to true. See git-commit-graph[1] for more information", "core.compression\tAn integer -1..9, indicating a default compression level. -1 is the zlib default. 0 means no compression, and 1..9 are various speed/size tradeoffs, 9 being slowest. If set, this provides a default to other compression variables, such as `core.looseCompression` and `pack.compression`", "core.createObject\tYou can set this to 'link', in which case a hardlink followed by a delete of the source are used to make sure that object creation will not overwrite existing objects", "core.deltaBaseCacheLimit\tMaximum number of bytes per thread to reserve for caching base objects that may be referenced by multiple deltified objects. By storing the entire decompressed base objects in a cache Git is able to avoid unpacking and decompressing frequently used base objects multiple times", "core.editor\tCommands such as `commit` and `tag` that let you edit messages by launching an editor use the value of this variable when it is set, and the environment variable `GIT_EDITOR` is not set. See git-var[1]", "core.eol\tSets the line ending type to use in the working directory for files that are marked as text (either by having the `text` attribute set, or by having `text=auto` and Git auto-detecting the contents as text). Alternatives are 'lf', 'crlf' and 'native', which uses the platform's native line ending. The default value is `native`. See gitattributes[5] for more information on end-of-line conversion. Note that this value is ignored if `core.autocrlf` is set to `true` or `input`", "core.excludesFile\tSpecifies the pathname to the file that contains patterns to describe paths that are not meant to be tracked, in addition to `.gitignore` (per-directory) and `.git/info/exclude`. Defaults to `$XDG_CONFIG_HOME/git/ignore`. If `$XDG_CONFIG_HOME` is either not set or empty, `$HOME/.config/git/ignore` is used instead. See gitignore[5]", "core.fileMode\tTells Git if the executable bit of files in the working tree is to be honored", "core.filesRefLockTimeout\tThe length of time, in milliseconds, to retry when trying to lock an individual reference. Value 0 means not to retry at all; -1 means to try indefinitely. Default is 100 (i.e., retry for 100ms)", "core.fsmonitor\tIf set to true, enable the built-in file system monitor daemon for this working directory (git-fsmonitor{litdd}daemon[1])", "core.fsmonitorHookVersion\tSets the protocol version to be used when invoking the \"fsmonitor\" hook", "core.fsync\tA comma-separated list of components of the repository that should be hardened via the core.fsyncMethod when created or modified. You can disable hardening of any component by prefixing it with a '-'. Items that are not hardened may be lost in the event of an unclean system shutdown. Unless you have special requirements, it is recommended that you leave this option empty or pick one of `committed`, `added`, or `all`", "core.fsyncMethod\tA value indicating the strategy Git will use to harden repository data using fsync and related primitives", "core.fsyncObjectFiles\tThis boolean will enable 'fsync()' when writing object files. This setting is deprecated. Use core.fsync instead", "core.gitProxy\tA \"proxy command\" to execute (as 'command host port') instead of establishing direct connection to the remote server when using the Git protocol for fetching. If the variable value is in the \"COMMAND for DOMAIN\" format, the command is applied only on hostnames ending with the specified domain string. This variable may be set multiple times and is matched in the given order; the first match wins", "core.hideDotFiles\t(Windows-only) If true, mark newly-created directories and files whose name starts with a dot as hidden. If 'dotGitOnly', only the `.git/` directory is hidden, but no other files starting with a dot. The default mode is 'dotGitOnly'", "core.hooksPath\tBy default Git will look for your hooks in the `$GIT_DIR/hooks` directory. Set this to different path, e.g. `/etc/git/hooks`, and Git will try to find your hooks in that directory, e.g. `/etc/git/hooks/pre-receive` instead of in `$GIT_DIR/hooks/pre-receive`", "core.ignoreCase\tInternal variable which enables various workarounds to enable Git to work better on filesystems that are not case sensitive, like APFS, HFS+, FAT, NTFS, etc. For example, if a directory listing finds \"makefile\" when Git expects \"Makefile\", Git will assume it is really the same file, and continue to remember it as \"Makefile\"", "core.ignoreStat\tIf true, Git will avoid using lstat() calls to detect if files have changed by setting the \"assume-unchanged\" bit for those tracked files which it has updated identically in both the index and working tree", "core.logAllRefUpdates\tEnable the reflog. Updates to a ref <ref> is logged to the file \"`$GIT_DIR/logs/<ref>`\", by appending the new and old SHA-1, the date/time and the reason of the update, but only when the file exists. If this configuration variable is set to `true`, missing \"`$GIT_DIR/logs/<ref>`\" file is automatically created for branch heads (i.e. under `refs/heads/`), remote refs (i.e. under `refs/remotes/`), note refs (i.e. under `refs/notes/`), and the symbolic ref `HEAD`. If it is set to `always`, then a missing reflog is automatically created for any ref under `refs/`", "core.looseCompression\tAn integer -1..9, indicating the compression level for objects that are not in a pack file. -1 is the zlib default. 0 means no compression, and 1..9 are various speed/size tradeoffs, 9 being slowest. If not set, defaults to core.compression. If that is not set, defaults to 1 (best speed)", "core.multiPackIndex\tUse the multi-pack-index file to track multiple packfiles using a single index. See git-multi-pack-index[1] for more information. Defaults to true", "core.notesRef\tWhen showing commit messages, also show notes which are stored in the given ref. The ref must be fully qualified. If the given ref does not exist, it is not an error but means that no notes should be printed", "core.packedGitLimit\tMaximum number of bytes to map simultaneously into memory from pack files. If Git needs to access more than this many bytes at once to complete an operation it will unmap existing regions to reclaim virtual address space within the process", "core.packedGitWindowSize\tNumber of bytes of a pack file to map into memory in a single mapping operation. Larger window sizes may allow your system to process a smaller number of large pack files more quickly. Smaller window sizes will negatively affect performance due to increased calls to the operating system's memory manager, but may improve performance when accessing a large number of large pack files", "core.packedRefsTimeout\tThe length of time, in milliseconds, to retry when trying to lock the `packed-refs` file. Value 0 means not to retry at all; -1 means to try indefinitely. Default is 1000 (i.e., retry for 1 second)", "core.pager\tText viewer for use by Git commands (e.g., 'less'). The value is meant to be interpreted by the shell. The order of preference is the `$GIT_PAGER` environment variable, then `core.pager` configuration, then `$PAGER`, and then the default chosen at compile time (usually 'less')", "core.precomposeUnicode\tThis option is only used by Mac OS implementation of Git. When core.precomposeUnicode=true, Git reverts the unicode decomposition of filenames done by Mac OS. This is useful when sharing a repository between Mac OS and Linux or Windows. (Git for Windows 1.7.10 or higher is needed, or Git under cygwin 1.7). When false, file names are handled fully transparent by Git, which is backward compatible with older versions of Git", "core.preferSymlinkRefs\tInstead of the default \"symref\" format for HEAD and other symbolic reference files, use symbolic links. This is sometimes needed to work with old scripts that expect HEAD to be a symbolic link", "core.preloadIndex\tEnable parallel index preload for operations like 'git diff'", "core.protectHFS\tIf set to true, do not allow checkout of paths that would be considered equivalent to `.git` on an HFS+ filesystem. Defaults to `true` on Mac OS, and `false` elsewhere", "core.protectNTFS\tIf set to true, do not allow checkout of paths that would cause problems with the NTFS filesystem, e.g. conflict with 8.3 \"short\" names. Defaults to `true` on Windows, and `false` elsewhere", "core.quotePath\tCommands that output paths (e.g. 'ls-files', 'diff'), will quote \"unusual\" characters in the pathname by enclosing the pathname in double-quotes and escaping those characters with backslashes in the same way C escapes control characters (e.g. `\\t` for TAB, `\\n` for LF, `\\\\` for backslash) or bytes with values larger than 0x80 (e.g. octal `\\302\\265` for \"micro\" in UTF-8). If this variable is set to false, bytes higher than 0x80 are not considered \"unusual\" any more. Double-quotes, backslash and control characters are always escaped regardless of the setting of this variable. A simple space character is not considered \"unusual\". Many commands can output pathnames completely verbatim using the `-z` option. The default value is true", "core.repositoryFormatVersion\tInternal variable identifying the repository format and layout version", "core.restrictinheritedhandles\tWindows-only: override whether spawned processes inherit only standard file handles (`stdin`, `stdout` and `stderr`) or all handles. Can be `auto`, `true` or `false`. Defaults to `auto`, which means `true` on Windows 7 and later, and `false` on older Windows versions", "core.safecrlf\tIf true, makes Git check if converting `CRLF` is reversible when end-of-line conversion is active. Git will verify if a command modifies a file in the work tree either directly or indirectly. For example, committing a file followed by checking out the same file should yield the original file in the work tree. If this is not the case for the current setting of `core.autocrlf`, Git will reject the file. The variable can be set to \"warn\", in which case Git will only warn about an irreversible conversion but continue the operation", "core.sharedRepository\tWhen 'group' (or 'true'), the repository is made shareable between several users in a group (making sure all the files and objects are group-writable). When 'all' (or 'world' or 'everybody'), the repository will be readable by all users, additionally to being group-shareable. When 'umask' (or 'false'), Git will use permissions reported by umask(2). When '0xxx', where '0xxx' is an octal number, files in the repository will have this mode value. '0xxx' will override user's umask value (whereas the other options will only override requested parts of the user's umask value). Examples: '0660' will make the repo read/write-able for the owner and group, but inaccessible to others (equivalent to 'group' unless umask is e.g. '0022'). '0640' is a repository that is group-readable but not group-writable. See git-init[1]. False by default", "core.sparseCheckout\tEnable \"sparse checkout\" feature. See git-sparse-checkout[1] for more information", "core.sparseCheckoutCone\tEnables the \"cone mode\" of the sparse checkout feature. When the sparse-checkout file contains a limited set of patterns, this mode provides significant performance advantages. The \"non-cone mode\" can be requested to allow specifying more flexible patterns by setting this variable to 'false'. See git-sparse-checkout[1] for more information", "core.splitIndex\tIf true, the split-index feature of the index will be used. See git-update-index[1]. False by default", "core.sshCommand\tIf this variable is set, `git fetch` and `git push` will use the specified command instead of `ssh` when they need to connect to a remote system. The command is in the same form as the `GIT_SSH_COMMAND` environment variable and is overridden when the environment variable is set", "core.symlinks\tIf false, symbolic links are checked out as small plain files that contain the link text. git-update-index[1] and git-add[1] will not change the recorded type to regular file. Useful on filesystems like FAT that do not support symbolic links", "core.trustctime\tIf false, the ctime differences between the index and the working tree are ignored; useful when the inode change time is regularly modified by something outside Git (file system crawlers and some backup systems). See git-update-index[1]. True by default", "core.unsetenvvars\tWindows-only: comma-separated list of environment variables' names that need to be unset before spawning any other process. Defaults to `PERL5LIB` to account for the fact that Git for Windows insists on using its own Perl interpreter", "core.untrackedCache\tDetermines what to do about the untracked cache feature of the index. It will be kept, if this variable is unset or set to `keep`. It will automatically be added if set to `true`. And it will automatically be removed, if set to `false`. Before setting it to `true`, you should check that mtime is working properly on your system. See git-update-index[1]. `keep` by default, unless `feature.manyFiles` is enabled which sets this setting to `true` by default", "core.useReplaceRefs\tIf set to `false`, behave as if the `--no-replace-objects` option was given on the command line. See git[1] and git-replace[1] for more information", "core.warnAmbiguousRefs\tIf true, Git will warn you if the ref name you passed it is ambiguous and might match multiple refs in the repository. True by default", "core.whitespace\tA comma separated list of common whitespace problems to notice. 'git diff' will use `color.diff.whitespace` to highlight them, and 'git apply --whitespace=error' will consider them as errors. You can prefix `-` to disable any of them (e.g. `-trailing-space`):", "core.worktree\tSet the path to the root of the working tree. If `GIT_COMMON_DIR` environment variable is set, core.worktree is ignored and not used for determining the root of working tree. This can be overridden by the `GIT_WORK_TREE` environment variable and the `--work-tree` command-line option. The value can be an absolute path or relative to the path to the .git directory, which is either specified by --git-dir or GIT_DIR, or automatically discovered. If --git-dir or GIT_DIR is specified but none of --work-tree, GIT_WORK_TREE and core.worktree is specified, the current working directory is regarded as the top level of your working tree", "credential.helper\tSpecify an external helper to be called when a username or password credential is needed; the helper may consult external storage to avoid prompting the user for the credentials. This is normally the name of a credential helper with possible arguments, but may also be an absolute path with arguments or, if preceded by `!`, shell commands", "credential.useHttpPath\tWhen acquiring credentials, consider the \"path\" component of an http or https URL to be important. Defaults to false. See gitcredentials[7] for more information", "credential.username\tIf no username is set for a network authentication, use this username by default. See credential.<context>.* below, and gitcredentials[7]", "credentialCache.ignoreSIGHUP\tTell git-credential-cache--daemon to ignore SIGHUP, instead of quitting", "credentialStore.lockTimeoutMS\tThe length of time, in milliseconds, for git-credential-store to retry when trying to lock the credentials file. Value 0 means not to retry at all; -1 means to try indefinitely. Default is 1000 (i.e., retry for 1s)", "credential.<url>.helper\tSpecify an external helper to be called when a username or password credential is needed; the helper may consult external storage to avoid prompting the user for the credentials. This is normally the name of a credential helper with possible arguments, but may also be an absolute path with arguments or, if preceded by `!`, shell commands", "credential.<url>.useHttpPath\tWhen acquiring credentials, consider the \"path\" component of an http or https URL to be important. Defaults to false. See gitcredentials[7] for more information", "credential.<url>.username\tIf no username is set for a network authentication, use this username by default. See credential.<context>.* below, and gitcredentials[7]", "credentialCache.<url>.ignoreSIGHUP\tTell git-credential-cache--daemon to ignore SIGHUP, instead of quitting", "credentialStore.<url>.lockTimeoutMS\tThe length of time, in milliseconds, for git-credential-store to retry when trying to lock the credentials file. Value 0 means not to retry at all; -1 means to try indefinitely. Default is 1000 (i.e., retry for 1s)", "diff.<driver>.binary\tSet this option to true to make the diff driver treat files as binary. See gitattributes[5] for details", "diff.<driver>.cachetextconv\tSet this option to true to make the diff driver cache the text conversion outputs. See gitattributes[5] for details", "diff.<driver>.command\tThe custom diff driver command. See gitattributes[5] for details", "diff.<driver>.textconv\tThe command that the diff driver should call to generate the text-converted version of a file. The result of the conversion is used to generate a human-readable diff. See gitattributes[5] for details", "diff.<driver>.wordRegex\tThe regular expression that the diff driver should use to split words in a line. See gitattributes[5] for details", "diff.<driver>.xfuncname\tThe regular expression that the diff driver should use to recognize the hunk header. A built-in pattern may also be used. See gitattributes[5] for details", "diff.algorithm\tChoose a diff algorithm", "diff.autoRefreshIndex\tWhen using 'git diff' to compare with work tree files, do not consider stat-only change as changed. Instead, silently run `git update-index --refresh` to update the cached stat information for paths whose contents in the work tree match the contents in the index. This option defaults to true. Note that this affects only 'git diff' Porcelain, and not lower level 'diff' commands such as 'git diff-files'", "diff.colorMoved\tIf set to either a valid `<mode>` or a true value, moved lines in a diff are colored differently, for details of valid modes see '--color-moved' in git-diff[1]. If simply set to true the default color mode will be used. When set to false, moved lines are not colored", "diff.colorMovedWS\tWhen moved lines are colored using e.g. the `diff.colorMoved` setting, this option controls the `<mode>` how spaces are treated for details of valid modes see '--color-moved-ws' in git-diff[1]", "diff.context\tGenerate diffs with <n> lines of context instead of the default of 3. This value is overridden by the -U option", "diff.dirstat\tA comma separated list of `--dirstat` parameters specifying the default behavior of the `--dirstat` option to git-diff[1] and friends. The defaults can be overridden on the command line (using `--dirstat=<param1,param2,...>`). The fallback defaults (when not changed by `diff.dirstat`) are `changes,noncumulative,3`. The following parameters are available:", "diff.external\tIf this config variable is set, diff generation is not performed using the internal diff machinery, but using the given command. Can be overridden with the `GIT_EXTERNAL_DIFF' environment variable. The command is called with parameters as described under \"git Diffs\" in git[1]. Note: if you want to use an external diff program only on a subset of your files, you might want to use gitattributes[5] instead", "diff.guitool\tControls which diff tool is used by git-difftool[1] when the -g/--gui flag is specified. This variable overrides the value configured in `merge.guitool`. The list below shows the valid built-in values. Any other value is treated as a custom diff tool and requires that a corresponding difftool.<guitool>.cmd variable is defined", "diff.ignoreSubmodules\tSets the default value of --ignore-submodules. Note that this affects only 'git diff' Porcelain, and not lower level 'diff' commands such as 'git diff-files'. 'git checkout' and 'git switch' also honor this setting when reporting uncommitted changes. Setting it to 'all' disables the submodule summary normally shown by 'git commit' and 'git status' when `status.submoduleSummary` is set unless it is overridden by using the --ignore-submodules command-line option. The 'git submodule' commands are not affected by this setting. By default this is set to untracked so that any untracked submodules are ignored", "diff.indentHeuristic\tSet this option to `false` to disable the default heuristics that shift diff hunk boundaries to make patches easier to read", "diff.interHunkContext\tShow the context between diff hunks, up to the specified number of lines, thereby fusing the hunks that are close to each other. This value serves as the default for the `--inter-hunk-context` command line option", "diff.mnemonicPrefix\tIf set, 'git diff' uses a prefix pair that is different from the standard \"a/\" and \"b/\" depending on what is being compared. When this configuration is in effect, reverse diff output also swaps the order of the prefixes:", "diff.noprefix\tIf set, 'git diff' does not show any source or destination prefix", "diff.orderFile\tFile indicating how to order files within a diff. See the '-O' option to git-diff[1] for details. If `diff.orderFile` is a relative pathname, it is treated as relative to the top of the working tree", "diff.relative\tIf set to 'true', 'git diff' does not show changes outside of the directory and show pathnames relative to the current directory", "diff.renameLimit\tThe number of files to consider in the exhaustive portion of copy/rename detection; equivalent to the 'git diff' option `-l`. If not set, the default value is currently 1000. This setting has no effect if rename detection is turned off", "diff.renames\tWhether and how Git detects renames. If set to \"false\", rename detection is disabled. If set to \"true\", basic rename detection is enabled. If set to \"copies\" or \"copy\", Git will detect copies, as well. Defaults to true. Note that this affects only 'git diff' Porcelain like git-diff[1] and git-log[1], and not lower level commands such as git-diff-files[1]", "diff.statGraphWidth\tLimit the width of the graph part in --stat output. If set, applies to all commands generating --stat output except format-patch", "diff.submodule\tSpecify the format in which differences in submodules are shown. The \"short\" format just shows the names of the commits at the beginning and end of the range. The \"log\" format lists the commits in the range like git-submodule[1] `summary` does. The \"diff\" format shows an inline diff of the changed contents of the submodule. Defaults to \"short\"", "diff.suppressBlankEmpty\tA boolean to inhibit the standard behavior of printing a space before each empty output line. Defaults to false", "diff.tool\tControls which diff tool is used by git-difftool[1]. This variable overrides the value configured in `merge.tool`. The list below shows the valid built-in values. Any other value is treated as a custom diff tool and requires that a corresponding difftool.<tool>.cmd variable is defined", "diff.wordRegex\tA POSIX Extended Regular Expression used to determine what is a \"word\" when performing word-by-word difference calculations. Character sequences that match the regular expression are \"words\", all other characters are *ignorable* whitespace", "diff.wsErrorHighlight\tHighlight whitespace errors in the `context`, `old` or `new` lines of the diff. Multiple values are separated by comma, `none` resets previous values, `default` reset the list to `new` and `all` is a shorthand for `old,new,context`. The whitespace errors are colored with `color.diff.whitespace`. The command line option `--ws-error-highlight=<kind>` overrides this setting", "difftool.<tool>.cmd\tSpecify the command to invoke the specified diff tool. The specified command is evaluated in shell with the following variables available: 'LOCAL' is set to the name of the temporary file containing the contents of the diff pre-image and 'REMOTE' is set to the name of the temporary file containing the contents of the diff post-image", "difftool.<tool>.path\tOverride the path for the given tool. This is useful in case your tool is not in the PATH", "difftool.prompt\tPrompt before each invocation of the diff tool", "extensions.objectFormat\tSpecify the hash algorithm to use. The acceptable values are `sha1` and `sha256`. If not specified, `sha1` is assumed. It is an error to specify this key unless `core.repositoryFormatVersion` is 1", "extensions.worktreeConfig\tIf enabled, then worktrees will load config settings from the `$GIT_DIR/config.worktree` file in addition to the `$GIT_COMMON_DIR/config` file. Note that `$GIT_COMMON_DIR` and `$GIT_DIR` are the same for the main working tree, while other working trees have `$GIT_DIR` equal to `$GIT_COMMON_DIR/worktrees/<id>/`. The settings in the `config.worktree` file will override settings from any other config files", "fastimport.unpackLimit\tIf the number of objects imported by git-fast-import[1] is below this limit, then the objects will be unpacked into loose object files. However if the number of imported objects equals or exceeds this limit then the pack will be stored as a pack. Storing the pack from a fast-import can make the import operation complete faster, especially on slow filesystems. If not set, the value of `transfer.unpackLimit` is used instead", "feature.*\tThe config settings that start with `feature.` modify the defaults of a group of other config settings. These groups are created by the Git developer community as recommended defaults and are subject to change. In particular, new config options may be added with different defaults", "feature.experimental\tEnable config options that are new to Git, and are being considered for future defaults. Config settings included here may be added or removed with each release, including minor version updates. These settings may have unintended interactions since they are so new. Please enable this setting if you are interested in providing feedback on experimental features. The new default values are:", "feature.manyFiles\tEnable config options that optimize for repos with many files in the working directory. With many files, commands such as `git status` and `git checkout` may be slow and these new defaults improve performance:", "fetch.fsck.<msg-id>\tActs like `fsck.<msg-id>`, but is used by git-fetch-pack[1] instead of git-fsck[1]. See the `fsck.<msg-id>` documentation for details", "fetch.fsck.skipList\tActs like `fsck.skipList`, but is used by git-fetch-pack[1] instead of git-fsck[1]. See the `fsck.skipList` documentation for details", "fetch.fsckObjects\tIf it is set to true, git-fetch-pack will check all fetched objects. See `transfer.fsckObjects` for what's checked. Defaults to false. If not set, the value of `transfer.fsckObjects` is used instead", "fetch.negotiationAlgorithm\tControl how information about the commits in the local repository is sent when negotiating the contents of the packfile to be sent by the server. Set to \"consecutive\" to use an algorithm that walks over consecutive commits checking each one. Set to \"skipping\" to use an algorithm that skips commits in an effort to converge faster, but may result in a larger-than-necessary packfile; or set to \"noop\" to not send any information at all, which will almost certainly result in a larger-than-necessary packfile, but will skip the negotiation step. Set to \"default\" to override settings made previously and use the default behaviour. The default is normally \"consecutive\", but if `feature.experimental` is true, then the default is \"skipping\". Unknown values will cause 'git fetch' to error out", "fetch.output\tControl how ref update status is printed. Valid values are `full` and `compact`. Default value is `full`. See section OUTPUT in git-fetch[1] for detail", "fetch.parallel\tSpecifies the maximal number of fetch operations to be run in parallel at a time (submodules, or remotes when the `--multiple` option of git-fetch[1] is in effect)", "fetch.prune\tIf true, fetch will automatically behave as if the `--prune` option was given on the command line. See also `remote.<name>.prune` and the PRUNING section of git-fetch[1]", "fetch.pruneTags\tIf true, fetch will automatically behave as if the `refs/tags/*:refs/tags/*` refspec was provided when pruning, if not set already. This allows for setting both this option and `fetch.prune` to maintain a 1=1 mapping to upstream refs. See also `remote.<name>.pruneTags` and the PRUNING section of git-fetch[1]", "fetch.recurseSubmodules\tThis option controls whether `git fetch` (and the underlying fetch in `git pull`) will recursively fetch into populated submodules. This option can be set either to a boolean value or to 'on-demand'. Setting it to a boolean changes the behavior of fetch and pull to recurse unconditionally into submodules when set to true or to not recurse at all when set to false. When set to 'on-demand', fetch and pull will only recurse into a populated submodule when its superproject retrieves a commit that updates the submodule's reference. Defaults to 'on-demand', or to the value of 'submodule.recurse' if set", "fetch.showForcedUpdates\tSet to false to enable `--no-show-forced-updates` in git-fetch[1] and git-pull[1] commands. Defaults to true", "fetch.unpackLimit\tIf the number of objects fetched over the Git native transfer is below this limit, then the objects will be unpacked into loose object files. However if the number of received objects equals or exceeds this limit then the received pack will be stored as a pack, after adding any missing delta bases. Storing the pack from a push can make the push operation complete faster, especially on slow filesystems. If not set, the value of `transfer.unpackLimit` is used instead", "fetch.writeCommitGraph\tSet to true to write a commit-graph after every `git fetch` command that downloads a pack-file from a remote. Using the `--split` option, most executions will create a very small commit-graph file on top of the existing commit-graph file(s). Occasionally, these files will merge and the write may take longer. Having an updated commit-graph file helps performance of many Git commands, including `git merge-base`, `git push -f`, and `git log --graph`. Defaults to false", "filter.<driver>.clean\tThe command which is used to convert the content of a worktree file to a blob upon checkin. See gitattributes[5] for details", "filter.<driver>.smudge\tThe command which is used to convert the content of a blob object to a worktree file upon checkout. See gitattributes[5] for details", "format.attach\tEnable multipart/mixed attachments as the default for 'format-patch'. The value can also be a double quoted string which will enable attachments as the default and set the value as the boundary. See the --attach option in git-format-patch[1]", "format.cc\tAdditional recipients to include in a patch to be submitted by mail. See the --to and --cc options in git-format-patch[1]", "format.coverFromDescription\tThe default mode for format-patch to determine which parts of the cover letter will be populated using the branch's description. See the `--cover-from-description` option in git-format-patch[1]", "format.coverLetter\tA boolean that controls whether to generate a cover-letter when format-patch is invoked, but in addition can be set to \"auto\", to generate a cover-letter only when there's more than one patch. Default is false", "format.encodeEmailHeaders\tEncode email headers that have non-ASCII characters with \"Q-encoding\" (described in RFC 2047) for email transmission. Defaults to true", "format.filenameMaxLength\tThe maximum length of the output filenames generated by the `format-patch` command; defaults to 64. Can be overridden by the `--filename-max-length=<n>` command line option", "format.from\tProvides the default value for the `--from` option to format-patch. Accepts a boolean value, or a name and email address. If false, format-patch defaults to `--no-from`, using commit authors directly in the \"From:\" field of patch mails. If true, format-patch defaults to `--from`, using your committer identity in the \"From:\" field of patch mails and including a \"From:\" field in the body of the patch mail if different. If set to a non-boolean value, format-patch uses that value instead of your committer identity. Defaults to false", "format.headers\tAdditional email headers to include in a patch to be submitted by mail. See git-format-patch[1]", "format.notes\tProvides the default value for the `--notes` option to format-patch. Accepts a boolean value, or a ref which specifies where to get notes. If false, format-patch defaults to `--no-notes`. If true, format-patch defaults to `--notes`. If set to a non-boolean value, format-patch defaults to `--notes=<ref>`, where `ref` is the non-boolean value. Defaults to false", "format.numbered\tA boolean which can enable or disable sequence numbers in patch subjects. It defaults to \"auto\" which enables it only if there is more than one patch. It can be enabled or disabled for all messages by setting it to \"true\" or \"false\". See --numbered option in git-format-patch[1]", "format.outputDirectory\tSet a custom directory to store the resulting files instead of the current working directory. All directory components will be created", "format.pretty\tThe default pretty format for log/show/whatchanged command, See git-log[1], git-show[1], git-whatchanged[1]", "format.signature\tThe default for format-patch is to output a signature containing the Git version number. Use this variable to change that default. Set this variable to the empty string (\"\") to suppress signature generation", "format.signatureFile\tWorks just like format.signature except the contents of the file specified by this variable will be used as the signature", "format.signOff\tA boolean value which lets you enable the `-s/--signoff` option of format-patch by default. *Note:* Adding the `Signed-off-by` trailer to a patch should be a conscious act and means that you certify you have the rights to submit this work under the same open source license. Please see the 'SubmittingPatches' document for further discussion", "format.subjectPrefix\tThe default for format-patch is to output files with the '[PATCH]' subject prefix. Use this variable to change that prefix", "format.suffix\tThe default for format-patch is to output files with the suffix `.patch`. Use this variable to change that suffix (make sure to include the dot if you want it)", "format.thread\tThe default threading style for 'git format-patch'. Can be a boolean value, or `shallow` or `deep`. `shallow` threading makes every mail a reply to the head of the series, where the head is chosen from the cover letter, the `--in-reply-to`, and the first patch mail, in this order. `deep` threading makes every mail a reply to the previous one. A true boolean value is the same as `shallow`, and a false value disables threading", "format.useAutoBase\tA boolean value which lets you enable the `--base=auto` option of format-patch by default. Can also be set to \"whenAble\" to allow enabling `--base=auto` if a suitable base is available, but to skip adding base info otherwise without the format dying", "fsck.<msg-id>\tDuring fsck git may find issues with legacy data which wouldn't be generated by current versions of git, and which wouldn't be sent over the wire if `transfer.fsckObjects` was set. This feature is intended to support working with legacy repositories containing such data", "fsck.skipList\tThe path to a list of object names (i.e. one unabbreviated SHA-1 per line) that are known to be broken in a non-fatal way and should be ignored. On versions of Git 2.20 and later comments ('#'), empty lines, and any leading and trailing whitespace is ignored. Everything but a SHA-1 per line will error out on older versions", "gc.<pattern>.reflogExpire\t'git reflog expire' removes reflog entries older than this time; defaults to 90 days. The value \"now\" expires all entries immediately, and \"never\" suppresses expiration altogether. With \"<pattern>\" (e.g. \"refs/stash\") in the middle the setting applies only to the refs that match the <pattern>", "gc.<pattern>.reflogExpireUnreachable\t'git reflog expire' removes reflog entries older than this time and are not reachable from the current tip; defaults to 30 days. The value \"now\" expires all entries immediately, and \"never\" suppresses expiration altogether. With \"<pattern>\" (e.g. \"refs/stash\") in the middle, the setting applies only to the refs that match the <pattern>", "gc.aggressiveDepth\tThe depth parameter used in the delta compression algorithm used by 'git gc --aggressive'. This defaults to 50, which is the default for the `--depth` option when `--aggressive` isn't in use", "gc.aggressiveWindow\tThe window size parameter used in the delta compression algorithm used by 'git gc --aggressive'. This defaults to 250, which is a much more aggressive window size than the default `--window` of 10", "gc.auto\tWhen there are approximately more than this many loose objects in the repository, `git gc --auto` will pack them. Some Porcelain commands use this command to perform a light-weight garbage collection from time to time. The default value is 6700", "gc.autoDetach\tMake `git gc --auto` return immediately and run in background if the system supports it. Default is true", "gc.autoPackLimit\tWhen there are more than this many packs that are not marked with `*.keep` file in the repository, `git gc --auto` consolidates them into one larger pack. The default value is 50. Setting this to 0 disables it. Setting `gc.auto` to 0 will also disable this", "gc.bigPackThreshold\tIf non-zero, all packs larger than this limit are kept when `git gc` is run. This is very similar to `--keep-largest-pack` except that all packs that meet the threshold are kept, not just the largest pack. Defaults to zero. Common unit suffixes of 'k', 'm', or 'g' are supported", "gc.cruftPacks\tStore unreachable objects in a cruft pack (see git-repack[1]) instead of as loose objects. The default is `false`", "gc.logExpiry\tIf the file gc.log exists, then `git gc --auto` will print its content and exit with status zero instead of running unless that file is more than 'gc.logExpiry' old. Default is \"1.day\". See `gc.pruneExpire` for more ways to specify its value", "gc.packRefs\tRunning `git pack-refs` in a repository renders it unclonable by Git versions prior to 1.5.1.2 over dumb transports such as HTTP. This variable determines whether 'git gc' runs `git pack-refs`. This can be set to `notbare` to enable it within all non-bare repos or it can be set to a boolean value. The default is `true`", "gc.pruneExpire\tWhen 'git gc' is run, it will call 'prune --expire 2.weeks.ago' (and 'repack --cruft --cruft-expiration 2.weeks.ago' if using cruft packs via `gc.cruftPacks` or `--cruft`). Override the grace period with this config variable. The value \"now\" may be used to disable this grace period and always prune unreachable objects immediately, or \"never\" may be used to suppress pruning. This feature helps prevent corruption when 'git gc' runs concurrently with another process writing to the repository; see the \"NOTES\" section of git-gc[1]", "gc.rerereResolved\tRecords of conflicted merge you resolved earlier are kept for this many days when 'git rerere gc' is run. You can also use more human-readable \"1.month.ago\", etc. The default is 60 days. See git-rerere[1]", "gc.rerereUnresolved\tRecords of conflicted merge you have not resolved are kept for this many days when 'git rerere gc' is run. You can also use more human-readable \"1.month.ago\", etc. The default is 15 days. See git-rerere[1]", "gc.worktreePruneExpire\tWhen 'git gc' is run, it calls 'git worktree prune --expire 3.months.ago'. This config variable can be used to set a different grace period. The value \"now\" may be used to disable the grace period and prune `$GIT_DIR/worktrees` immediately, or \"never\" may be used to suppress pruning", "gc.writeCommitGraph\tIf true, then gc will rewrite the commit-graph file when git-gc[1] is run. When using `git gc --auto` the commit-graph will be updated if housekeeping is required. Default is true. See git-commit-graph[1] for details", "gitcvs.allBinary\tThis is used if `gitcvs.usecrlfattr` does not resolve the correct '-kb' mode to use. If true, all unresolved files are sent to the client in mode '-kb'. This causes the client to treat them as binary files, which suppresses any newline munging it otherwise might do. Alternatively, if it is set to \"guess\", then the contents of the file are examined to decide if it is binary, similar to `core.autocrlf`", "gitcvs.commitMsgAnnotation\tAppend this string to each commit message. Set to empty string to disable this feature. Defaults to \"via git-CVS emulator\"", "gitcvs.dbDriver\tUsed Perl DBI driver. You can specify any available driver for this here, but it might not work. git-cvsserver is tested with 'DBD::SQLite', reported to work with 'DBD::Pg', and reported *not* to work with 'DBD::mysql'. Experimental feature. May not contain double colons (`:`). Default: 'SQLite'. See git-cvsserver[1]", "gitcvs.dbName\tDatabase used by git-cvsserver to cache revision information derived from the Git repository. The exact meaning depends on the used database driver, for SQLite (which is the default driver) this is a filename. Supports variable substitution (see git-cvsserver[1] for details). May not contain semicolons (`;`). Default: '%Ggitcvs.%m.sqlite'", "gitcvs.dbTableNamePrefix\tDatabase table name prefix. Prepended to the names of any database tables used, allowing a single database to be used for several repositories. Supports variable substitution (see git-cvsserver[1] for details). Any non-alphabetic characters will be replaced with underscores", "gitcvs.dbUser\tDatabase user and password. Only useful if setting `gitcvs.dbDriver`, since SQLite has no concept of database users and/or passwords. 'gitcvs.dbUser' supports variable substitution (see git-cvsserver[1] for details)", "gitcvs.enabled\tWhether the CVS server interface is enabled for this repository. See git-cvsserver[1]", "gitcvs.logFile\tPath to a log file where the CVS server interface well... logs various stuff. See git-cvsserver[1]", "gitcvs.usecrlfattr\tIf true, the server will look up the end-of-line conversion attributes for files to determine the `-k` modes to use. If the attributes force Git to treat a file as text, the `-k` mode will be left blank so CVS clients will treat it as text. If they suppress text conversion, the file will be set with '-kb' mode, which suppresses any newline munging the client might otherwise do. If the attributes do not allow the file type to be determined, then `gitcvs.allBinary` is used. See gitattributes[5]", "gitweb.snapshot\tSee gitweb.conf[5] for description", "gitweb.url\tSee gitweb[1] for description", "gpg.<format>.program\tUse this to customize the program used for the signing format you chose. (see `gpg.program` and `gpg.format`) `gpg.program` can still be used as a legacy synonym for `gpg.openpgp.program`. The default value for `gpg.x509.program` is \"gpgsm\" and `gpg.ssh.program` is \"ssh-keygen\"", "gpg.format\tSpecifies which key format to use when signing with `--gpg-sign`. Default is \"openpgp\". Other possible values are \"x509\", \"ssh\"", "gpg.minTrustLevel\tSpecifies a minimum trust level for signature verification. If this option is unset, then signature verification for merge operations require a key with at least `marginal` trust. Other operations that perform signature verification require a key with at least `undefined` trust. Setting this option overrides the required trust-level for all operations. Supported values, in increasing order of significance:", "gpg.program\tUse this custom program instead of \"`gpg`\" found on `$PATH` when making or verifying a PGP signature. The program must support the same command-line interface as GPG, namely, to verify a detached signature, \"`gpg --verify $signature - <$file`\" is run, and the program is expected to signal a good signature by exiting with code 0, and to generate an ASCII-armored detached signature, the standard input of \"`gpg -bsau $key`\" is fed with the contents to be signed, and the program is expected to send the result to its standard output", "gpg.ssh.allowedSignersFile\tA file containing ssh public keys which you are willing to trust. The file consists of one or more lines of principals followed by an ssh public key. e.g.: `user1@example.com,user2@example.com ssh-rsa AAAAX1...` See ssh-keygen(1) \"ALLOWED SIGNERS\" for details. The principal is only used to identify the key and is available when verifying a signature", "gpg.ssh.defaultKeyCommand\tThis command that will be run when user.signingkey is not set and a ssh signature is requested. On successful exit a valid ssh public key prefixed with `key::` is expected in the first line of its output. This allows for a script doing a dynamic lookup of the correct public key when it is impractical to statically configure `user.signingKey`. For example when keys or SSH Certificates are rotated frequently or selection of the right key depends on external factors unknown to git", "gpg.ssh.revocationFile\tEither a SSH KRL or a list of revoked public keys (without the principal prefix). See ssh-keygen(1) for details. If a public key is found in this file then it will always be treated as having trust level \"never\" and signatures will show as invalid", "grep.column\tIf set to true, enable the `--column` option by default", "grep.extendedRegexp\tIf set to true, enable `--extended-regexp` option by default. This option is ignored when the `grep.patternType` option is set to a value other than 'default'", "grep.fallbackToNoIndex\tIf set to true, fall back to git grep --no-index if git grep is executed outside of a git repository. Defaults to false", "grep.lineNumber\tIf set to true, enable `-n` option by default", "grep.patternType\tSet the default matching behavior. Using a value of 'basic', 'extended', 'fixed', or 'perl' will enable the `--basic-regexp`, `--extended-regexp`, `--fixed-strings`, or `--perl-regexp` option accordingly, while the value 'default' will use the `grep.extendedRegexp` option to choose between 'basic' and 'extended'", "grep.threads\tNumber of grep worker threads to use. See `grep.threads` in git-grep[1] for more information", "gui.blamehistoryctx\tSpecifies the radius of history context in days to show in gitk[1] for the selected commit, when the `Show History Context` menu item is invoked from 'git gui blame'. If this variable is set to zero, the whole history is shown", "gui.commitMsgWidth\tDefines how wide the commit message window is in the git-gui[1]. \"75\" is the default", "gui.copyBlameThreshold\tSpecifies the threshold to use in 'git gui blame' original location detection, measured in alphanumeric characters. See the git-blame[1] manual for more information on copy detection", "gui.diffContext\tSpecifies how many context lines should be used in calls to diff made by the git-gui[1]. The default is \"5\"", "gui.displayUntracked\tDetermines if git-gui[1] shows untracked files in the file list. The default is \"true\"", "gui.encoding\tSpecifies the default character encoding to use for displaying of file contents in git-gui[1] and gitk[1]. It can be overridden by setting the 'encoding' attribute for relevant files (see gitattributes[5]). If this option is not set, the tools default to the locale encoding", "gui.fastCopyBlame\tIf true, 'git gui blame' uses `-C` instead of `-C -C` for original location detection. It makes blame significantly faster on huge repositories at the expense of less thorough copy detection", "gui.matchTrackingBranch\tDetermines if new branches created with git-gui[1] should default to tracking remote branches with matching names or not. Default: \"false\"", "gui.newBranchTemplate\tIs used as suggested name when creating new branches using the git-gui[1]", "gui.pruneDuringFetch\t\"true\" if git-gui[1] should prune remote-tracking branches when performing a fetch. The default value is \"false\"", "gui.spellingDictionary\tSpecifies the dictionary used for spell checking commit messages in the git-gui[1]. When set to \"none\" spell checking is turned off", "gui.trustmtime\tDetermines if git-gui[1] should trust the file modification timestamp or not. By default the timestamps are not trusted", "guitool.<name>.argPrompt\tRequest a string argument from the user, and pass it to the tool through the `ARGS` environment variable. Since requesting an argument implies confirmation, the 'confirm' option has no effect if this is enabled. If the option is set to 'true', 'yes', or '1', the dialog uses a built-in generic prompt; otherwise the exact value of the variable is used", "guitool.<name>.cmd\tSpecifies the shell command line to execute when the corresponding item of the git-gui[1] `Tools` menu is invoked. This option is mandatory for every tool. The command is executed from the root of the working directory, and in the environment it receives the name of the tool as `GIT_GUITOOL`, the name of the currently selected file as 'FILENAME', and the name of the current branch as 'CUR_BRANCH' (if the head is detached, 'CUR_BRANCH' is empty)", "guitool.<name>.confirm\tShow a confirmation dialog before actually running the tool", "guitool.<name>.needsFile\tRun the tool only if a diff is selected in the GUI. It guarantees that 'FILENAME' is not empty", "guitool.<name>.noConsole\tRun the command silently, without creating a window to display its output", "guitool.<name>.noRescan\tDon't rescan the working directory for changes after the tool finishes execution", "guitool.<name>.prompt\tSpecifies the general prompt string to display at the top of the dialog, before subsections for 'argPrompt' and 'revPrompt'. The default value includes the actual command", "guitool.<name>.revPrompt\tRequest a single valid revision from the user, and set the `REVISION` environment variable. In other aspects this option is similar to 'argPrompt', and can be used together with it", "guitool.<name>.revUnmerged\tShow only unmerged branches in the 'revPrompt' subdialog. This is useful for tools similar to merge or rebase, but not for things like checkout or reset", "guitool.<name>.title\tSpecifies the title to use for the prompt dialog. The default is the tool name", "help.autoCorrect\tIf git detects typos and can identify exactly one valid command similar to the error, git will try to suggest the correct command or even run the suggestion automatically. Possible config values are: - 0 (default): show the suggested command. - positive number: run the suggested command after specified", "help.browser\tSpecify the browser that will be used to display help in the 'web' format. See git-help[1]", "help.format\tOverride the default help format used by git-help[1]. Values 'man', 'info', 'web' and 'html' are supported. 'man' is the default. 'web' and 'html' are the same", "help.htmlPath\tSpecify the path where the HTML documentation resides. File system paths and URLs are supported. HTML pages will be prefixed with this path when help is displayed in the 'web' format. This defaults to the documentation path of your Git installation", "http.cookieFile\tThe pathname of a file containing previously stored cookie lines, which should be used in the Git http session, if they match the server. The file format of the file to read cookies from should be plain HTTP headers or the Netscape/Mozilla cookie file format (see `curl(1)`). NOTE that the file specified with http.cookieFile is used only as input unless http.saveCookies is set", "http.curloptResolve\tHostname resolution information that will be used first by libcurl when sending HTTP requests. This information should be in one of the following formats:", "http.delegation\tControl GSSAPI credential delegation. The delegation is disabled by default in libcurl since version 7.21.7. Set parameter to tell the server what it is allowed to delegate when it comes to user credentials. Used with GSS/kerberos. Possible values are:", "http.emptyAuth\tAttempt authentication without seeking a username or password. This can be used to attempt GSS-Negotiate authentication without specifying a username in the URL, as libcurl normally requires a username for authentication", "http.extraHeader\tPass an additional HTTP header when communicating with a server. If more than one such entry exists, all of them are added as extra headers. To allow overriding the settings inherited from the system config, an empty value will reset the extra headers to the empty list", "http.followRedirects\tWhether git should follow HTTP redirects. If set to `true`, git will transparently follow any redirect issued by a server it encounters. If set to `false`, git will treat all redirects as errors. If set to `initial`, git will follow redirects only for the initial request to a remote, but not for subsequent follow-up HTTP requests. Since git uses the redirected URL as the base for the follow-up requests, this is generally sufficient. The default is `initial`", "http.lowSpeedLimit\tIf the HTTP transfer speed is less than 'http.lowSpeedLimit' for longer than 'http.lowSpeedTime' seconds, the transfer is aborted. Can be overridden by the `GIT_HTTP_LOW_SPEED_LIMIT` and `GIT_HTTP_LOW_SPEED_TIME` environment variables", "http.maxRequests\tHow many HTTP requests to launch in parallel. Can be overridden by the `GIT_HTTP_MAX_REQUESTS` environment variable. Default is 5", "http.minSessions\tThe number of curl sessions (counted across slots) to be kept across requests. They will not be ended with curl_easy_cleanup() until http_cleanup() is invoked. If USE_CURL_MULTI is not defined, this value will be capped at 1. Defaults to 1", "http.noEPSV\tA boolean which disables using of EPSV ftp command by curl. This can helpful with some \"poor\" ftp servers which don't support EPSV mode. Can be overridden by the `GIT_CURL_FTP_NO_EPSV` environment variable. Default is false (curl will use EPSV)", "http.pinnedPubkey\tPublic key of the https service. It may either be the filename of a PEM or DER encoded public key file or a string starting with 'sha256//' followed by the base64 encoded sha256 hash of the public key. See also libcurl 'CURLOPT_PINNEDPUBLICKEY'. git will exit with an error if this option is set but not supported by cURL", "http.postBuffer\tMaximum size in bytes of the buffer used by smart HTTP transports when POSTing data to the remote system. For requests larger than this buffer size, HTTP/1.1 and Transfer-Encoding: chunked is used to avoid creating a massive pack file locally. Default is 1 MiB, which is sufficient for most requests", "http.proxy\tOverride the HTTP proxy, normally configured using the 'http_proxy', 'https_proxy', and 'all_proxy' environment variables (see `curl(1)`). In addition to the syntax understood by curl, it is possible to specify a proxy string with a user name but no password, in which case git will attempt to acquire one in the same way it does for other credentials. See gitcredentials[7] for more information. The syntax thus is '[protocol://][user[:password]@]proxyhost[:port]'. This can be overridden on a per-remote basis; see remote.<name>.proxy", "http.proxyAuthMethod\tSet the method with which to authenticate against the HTTP proxy. This only takes effect if the configured proxy string contains a user name part (i.e. is of the form 'user@host' or 'user@host:port'). This can be overridden on a per-remote basis; see `remote.<name>.proxyAuthMethod`. Both can be overridden by the `GIT_HTTP_PROXY_AUTHMETHOD` environment variable. Possible values are:", "http.proxySSLCAInfo\tPathname to the file containing the certificate bundle that should be used to verify the proxy with when using an HTTPS proxy. Can be overridden by the `GIT_PROXY_SSL_CAINFO` environment variable", "http.proxySSLCert\tThe pathname of a file that stores a client certificate to use to authenticate with an HTTPS proxy. Can be overridden by the `GIT_PROXY_SSL_CERT` environment variable", "http.proxySSLCertPasswordProtected\tEnable Git's password prompt for the proxy SSL certificate. Otherwise OpenSSL will prompt the user, possibly many times, if the certificate or private key is encrypted. Can be overridden by the `GIT_PROXY_SSL_CERT_PASSWORD_PROTECTED` environment variable", "http.proxySSLKey\tThe pathname of a file that stores a private key to use to authenticate with an HTTPS proxy. Can be overridden by the `GIT_PROXY_SSL_KEY` environment variable", "http.saveCookies\tIf set, store cookies received during requests to the file specified by http.cookieFile. Has no effect if http.cookieFile is unset", "http.schannelCheckRevoke\tUsed to enforce or disable certificate revocation checks in cURL when http.sslBackend is set to \"schannel\". Defaults to `true` if unset. Only necessary to disable this if Git consistently errors and the message is about checking the revocation status of a certificate. This option is ignored if cURL lacks support for setting the relevant SSL option at runtime", "http.schannelUseSSLCAInfo\tAs of cURL v7.60.0, the Secure Channel backend can use the certificate bundle provided via `http.sslCAInfo`, but that would override the Windows Certificate Store. Since this is not desirable by default, Git will tell cURL not to use that bundle by default when the `schannel` backend was configured via `http.sslBackend`, unless `http.schannelUseSSLCAInfo` overrides this behavior", "http.sslBackend\tName of the SSL backend to use (e.g. \"openssl\" or \"schannel\"). This option is ignored if cURL lacks support for choosing the SSL backend at runtime", "http.sslCAInfo\tFile containing the certificates to verify the peer with when fetching or pushing over HTTPS. Can be overridden by the `GIT_SSL_CAINFO` environment variable", "http.sslCAPath\tPath containing files with the CA certificates to verify the peer with when fetching or pushing over HTTPS. Can be overridden by the `GIT_SSL_CAPATH` environment variable", "http.sslCert\tFile containing the SSL certificate when fetching or pushing over HTTPS. Can be overridden by the `GIT_SSL_CERT` environment variable", "http.sslCertPasswordProtected\tEnable Git's password prompt for the SSL certificate. Otherwise OpenSSL will prompt the user, possibly many times, if the certificate or private key is encrypted. Can be overridden by the `GIT_SSL_CERT_PASSWORD_PROTECTED` environment variable", "http.sslKey\tFile containing the SSL private key when fetching or pushing over HTTPS. Can be overridden by the `GIT_SSL_KEY` environment variable", "http.sslTry\tAttempt to use AUTH SSL/TLS and encrypted data transfers when connecting via regular FTP protocol. This might be needed if the FTP server requires it for security reasons or you wish to connect securely whenever remote FTP server supports it. Default is false since it might trigger certificate verification errors on misconfigured servers", "http.sslVerify\tWhether to verify the SSL certificate when fetching or pushing over HTTPS. Defaults to true. Can be overridden by the `GIT_SSL_NO_VERIFY` environment variable", "http.sslVersion\tThe SSL version to use when negotiating an SSL connection, if you want to force the default. The available and default version depend on whether libcurl was built against NSS or OpenSSL and the particular configuration of the crypto library in use. Internally this sets the 'CURLOPT_SSL_VERSION' option; see the libcurl documentation for more details on the format of this option and for the ssl version supported. Currently the possible values of this option are:", "http.userAgent\tThe HTTP USER_AGENT string presented to an HTTP server. The default value represents the version of the client Git such as git/1.7.1. This option allows you to override this value to a more common value such as Mozilla/4.0. This may be necessary, for instance, if connecting through a firewall that restricts HTTP connections to a set of common USER_AGENT strings (but not including those like git/1.7.1). Can be overridden by the `GIT_HTTP_USER_AGENT` environment variable", "http.version\tUse the specified HTTP protocol version when communicating with a server. If you want to force the default. The available and default version depend on libcurl. Currently the possible values of this option are:", "http.<url>.cookieFile\tThe pathname of a file containing previously stored cookie lines, which should be used in the Git http session, if they match the server. The file format of the file to read cookies from should be