          "--pathspec-from-file": ""
          "--": "Separates pathsec from options for disambiguation purposes"
      - name: show
        description: "Show the changes recorded in the stash entry as a diff"
      - name: save
        description: "Temporarily stores all the modified tracked files"
        flags:
          "-p, --patch": "Interactively select hunks from the diff between HEAD and the working tree to be stashed"
          "-k, --keep-index": "All changed already added to the index are left intact"
          "-u, --include-untracked": "All untracked files are also stashed and then cleaned up"
          "-a, --all": "All ignored and untracked files are also stashed"
          "-q, --quiet": "Quiet, suppress feedback messages"
      - name: pop
        description: "Restores the most recently stashed files"
        flags:
          "--index": "Tries to reinstate not only the working tree's changes, but also the index's ones"
          "-q, --quiet": "Quiet, suppress feedback messages"
      - name: list
        description: "Lists all stashed changesets"
      - name: drop
        description: "Discards the most recently stashed changeset"
        flags:
          "-q, --quiet": "Quiet, suppress feedback messages"
      - name: clear
        description: "Remove all the stash entries"
      - name: apply
        description: "Like pop, but do not remove the state from the stash list"
        flags:
          "--index": "Tries to reinstate not only the working tree's changes, but also the index's ones"
          "-q, --quiet": "Quiet, suppress feedback messages"
      - name: branch
        description: "Creates and checks out a new branch named"
      - name: create
        description: "Creates a stash entry"
      - name: store
        description: "Store a given stash in the stash ref, updating the stash reflog"
        flags:
          "-m, --message=": "Use the given <msg> as the stash message"
