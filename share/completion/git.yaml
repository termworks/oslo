  - name: status
    description: "Show the working tree status"
    flags:
      "-s, --short": "Give the output in the short-format"
      "-v, --verbose": "Be verbose"
      "-b, --branch": "Show branch information"
      "--show-stash": "Show stash information"
      "--porcelain?": "Give the output in the short-format"
      "--ahead-behind": "Display full ahead/behind values"
      "--no-ahead-behind": "Do not display full ahead/behind values"
      "--column?": "Display full ahead/behind values"
      "--no-column?": "Do not display untracked files in columns"
      "--long": "Show status in long format (default)"
      "-z, --null": "Terminate entries with NUL"
      "-u, --untracked-files?": "Show untracked files"
      "--ignore-submodules?": "Ignore changes to submodules when looking for changes"
      "--ignored?": "Show ignored files"
      "--no-renames": "Do not detect renames"
      "--renames": "Turn on rename detection regardless of user configuration"
      "--find-renames?": "Turn on rename detection, optionally setting the similarity threshold"
    completion:
      flag:
        untracked-files: ["all\t(Default)", normal, "no"]
        ignore-submodules: ["all\t(Default)", dirty, untracked, none]
        ignored: ["traditional\t(Default)", matching, "no"]
  - name: clean
    description: "Shows which files would be removed from working directory"
    flags:
      "-d": "Normally, when no <path> is specified, git clean will not recurse into untracked directories to avoid removing too much. Specify -d to have it recurse into such directories as well. If any paths are specified, -d is irrelevant; all untracked files matching the specified paths (with exceptions for nested git directories mentioned under --force) will be removed"
      "-f, --force": "If the Git configuration variable clean.requireForce is not set to false, git clean will refuse to delete files or directories unless given -f or -i"
      "-i, --interactive": "Show what would be done and clean files interactively"
      "-n, --dry-run": "Don’t actually remove anything, just show what would be done"
      "-q, --quiet": "Be quiet, only report errors, but not the files that are successfully removed"
      "-e, --exclude=": "Use the given exclude pattern in addition to the standard ignore rules"
      "-x": "Don’t use the standard ignore rules (see gitignore(5)), but still use the ignore rules given with -e options from the command line. This allows removing all untracked files, including build products. This can be used (possibly in conjunction with git restore or git reset) to create a pristine working directory to test a clean build"
      "-X": "Remove only files ignored by Git. This may be useful to rebuild everything from scratch, but keep manually created files"
    completion:
      positional:
        - ["$files"]
  - name: revert
    description: "Create new commit that undoes all of the changes made in <commit>, then apply it to the current branch"
    completion:
      positionalany: ["$revisions"]
  - name: ls-remote
    description: "List references in a remote repository"
  - name: push
    description: "Update remote refs"
    flags:
      "--all": "Push all branches (i.e. refs under refs/heads/); cannot be used with other <refspec>"
      "--prune": "Remove remote branches that don't have a local counterpart"
      "--mirror": "Instead of naming each ref to push, specifies that all refs under refs/ be mirrored to the remote repository"
      "-n, --dry-run": "Do everything except actually send the updates"
      "--porcelain": "Produce machine-readable output. The output status line for each ref will be tab-separated and sent to stdout instead of stderr"
      "-d, --delete": "All listed refs are deleted from the remote repository. This is the same as prefixing all refs with a colon"
      "--tags": "All refs under refs/tags are pushed, in addition to refspecs explicitly listed on the command line"
      "--follow-tags": "Push all the refs that would be pushed without this option, and also push annotated tags in refs/tags that are missing from the remote but are pointing at commit-ish that are reachable from the refs being pushed. This can also be specified with configuration variable push.followTags"
      "--signed?": "GPG-sign the push request to update refs on the receiving side, to allow it to be checked by the hooks and/or be logged. If false or --no-signed, no signing will be attempted. If true or --signed, the push will fail if the server does not support signed pushes. If set to if-asked, sign if and only if the server supports signed pushes. The push will also fail if the actual call to gpg --sign fails. See git-receive-pack(1) for the details on the receiving end"
      "--no-signed": "GPG-sign the push request to update refs on the receiving side, to allow it to be checked by the hooks and/or be logged. If false or --no-signed, no signing will be attempted. If true or --signed, the push will fail if the server does not support signed pushes. If set to if-asked, sign if and only if the server supports signed pushes. The push will also fail if the actual call to gpg --sign fails. See git-receive-pack(1) for the details on the receiving end"
      "--atomic": "Use an atomic transaction on the remote side if available. Either all refs are updated, or on error, no refs are updated. If the server does not support atomic pushes the push will fail"
      "--no-atomic": "Use an atomic transaction on the remote side if available. Either all refs are updated, or on error, no refs are updated. If the server does not support atomic pushes the push will fail"
      "-f, --force": "Usually, the command refuses to update a remote ref that is not an ancestor of the local ref used to overwrite it. Also, when --force-with-lease option is used, the command refuses to update a remote ref whose current value does not match what is expected. This flag disables these checks, and can cause the remote repository to lose commits; use it with care"
      "--repo?": "This option is equivalent to the <repository> argument. If both are specified, the command-line argument takes precedence"
      "-u, --set-upstream": "For every branch that is up to date or successfully pushed, add upstream (tracking) reference, used by argument-less git-pull(1) and other commands"
      "--thin": "These options are passed to git-send-pack(1). A thin transfer significantly reduces the amount of sent data when the sender and receiver share many of the same objects in common. The default is --thin"
      "--no-thin": "These options are passed to git-send-pack(1). A thin transfer significantly reduces the amount of sent data when the sender and receiver share many of the same objects in common. The default is --thin"
      "-q, --quiet": "Suppress all output, including the listing of updated refs, unless an error occurs. Progress is not reported to the standard error stream"
      "-v, --verbose": "Run verbosely"
      "--progress": "Progress status is reported on the standard error stream by default when it is attached to a terminal, unless -q is specified. This flag forces progress status even if the standard error stream is not directed to a terminal"
      "--no-recurse-submodules": "May be used to make sure all submodule commits used by the revisions to be pushed are available on a remote-tracking branch. If check is used Git will verify that all submodule commits that changed in the revisions to be pushed are available on at least one remote of the submodule. If any commits are missing the push will be aborted and exit with non-zero status. If on-demand is used all submodules that changed in the revisions to be pushed will be pushed. If on-demand was not able to push all necessary revisions it will also be aborted and exit with non-zero status. If only is used all submodules will be recursively pushed while the superproject is left unpushed. A value of no or using --no-recurse-submodules can be used to override the push.recurseSubmodules configuration variable when no submodule recursion is required"
      "--recurse-submodules?": "May be used to make sure all submodule commits used by the revisions to be pushed are available on a remote-tracking branch. If check is used Git will verify that all submodule commits that changed in the revisions to be pushed are available on at least one remote of the submodule. If any commits are missing the push will be aborted and exit with non-zero status. If on-demand is used all submodules that changed in the revisions to be pushed will be pushed. If on-demand was not able to push all necessary revisions it will also be aborted and exit with non-zero status. If only is used all submodules will be recursively pushed while the superproject is left unpushed. A value of no or using --no-recurse-submodules can be used to override the push.recurseSubmodules configuration variable when no submodule recursion is required"
      "--verify": "Turn on the pre-push hook. The default is --verify, giving the hook a chance to prevent the push. With"
      "--no-verify": "Turn off the pre-push hook. The default is --verify, giving the hook a chance to prevent the push. With"
      "-4, --ipv4": "Use IPv4 addresses only, ignoring IPv6 addresses"
      "-6, --ipv6": "Use IPv6 addresses only, ignoring IPv4 addresses"
      "-o, --push-option=": "Transmit the given string to the server, which passes them to the pre-receive as well as the post-receive hook. The given string must not contain a NUL or LF character. When multiple --push-option=<option> are given, they are all sent to the other side in the order listed on the command line. When no --push-option=<option> is given from the command line, the values of configuration variable push.pushOption are used instead"
      "--receive-pack, --exec=": "Path to the git-receive-pack program on the remote end. Sometimes useful when pushing to a remote repository over ssh, and you do not have the program in a directory on the default $PATH"
      "--no-force-with-lease": "Cancel all the previous --force-with-lease on the command line"
      "--force-with-lease?": "Protect the named ref (alone), if it is going to be updated, by requiring its current value to be the same as the specified value <expect> (which is allowed to be different from the remote-tracking branch we have for the refname, or we do not even have to have such a remote-tracking branch when this form is used). If <expect> is the empty string, then the named ref must not already exist"
    completion:
      positional:
        - ["$remotes"]
        - ["$branches"]
      flag:
        signed: ["true", "false", if-asked]
        recurse-submodules: [check, on-demand, only, "no"]
  - name: pull
    description: "Integrate with another repository"
    flags:
      "--rebase, -r?": "Fetch the remote’s copy of current branch and rebases it into the local copy"
      "--no-rebase": "Override earlier --rebase"
      "--commit": "Perform the merge and commit the result. This option can be used to override --no-commit"
      "--no-commit": "Perform the merge and stop just before creating a merge commit, to give the user a chance to inspect and further tweak the merge result before committing"
      "--edit, -e": "Invoke an editor before committing successful mechanical merge to further edit the auto-generated merge message, so that the user can explain and justify the merge"
      "--no-edit": "The --no-edit option can be used to accept the auto-generated message (this is generally discouraged). The --edit (or -e) option is still useful if you are giving a draft message with the -m option from the command line and want to edit it in the editor"
      "--cleanup?": "This option determines how the merge message will be cleaned up before committing. See git-commit[1] for more details. In addition, if the <mode> is given a value of scissors, scissors will be appended to MERGE_MSG before being passed on to the commit machinery in the case of a merge conflict"
      "--ff": "When possible resolve the merge as a fast-forward (only update the branch pointer to match the merged branch; do not create a merge commit). When not possible (when the merged-in history is not a descendant of the current history), create a merge commit"
      "--no-ff": "Create a merge commit in all cases, even when the merge could instead be resolved as a fast-forward"
      "--ff-only": "Resolve the merge as a fast-forward when possible. When not possible, refuse to merge and exit with a non-zero status"
      "-S, --gpg-sign?": "GPG-sign the resulting merge commit. The keyid argument is optional and defaults to the committer identity; if specified, it must be stuck to the option without a space"
      "--no-gpg-sign": "Is useful to countermand both commit.gpgSign configuration variable, and earlier --gpg-sign"
      "--log?": "In addition to branch names, populate the log message with one-line descriptions from at most <n> actual commits that are being merged. See also git-fmt-merge-msg[1]"
      "--no-log": "Do not list one-line descriptions from the actual commits being merged"
      "--signoff": "Add a Signed-off-by trailer by the committer at the end of the commit log message. The meaning of a signoff depends on the project to which you’re committing. For example, it may certify that the committer has the rights to submit the work under the project’s license or agrees to some contributor representation, such as a Developer Certificate of Origin. (See http://developercertificate.org for the one used by the Linux kernel and Git projects.) Consult the documentation or leadership of the project to which you’re contributing to understand how the signoffs are used in that project"
      "--no-signoff": "Can be used to countermand an earlier --signoff option on the command line"
      "--stat": "Show a diffstat at the end of the merge. The diffstat is also controlled by the configuration option merge.stat"
      "-n, --no-stat": "Do not show a diffstat at the end of the merge"
      "--squash": "With --squash, --commit is not allowed, and will fail. Produce the working tree and index state as if a real merge happened (except for the merge information), but do not actually make a commit, move the HEAD, or record $GIT_DIR/MERGE_HEAD (to cause the next git commit command to create a merge commit). This allows you to create a single commit on top of the current branch whose effect is the same as merging another branch (or more in case of an octopus)"
      "--no-squash": "Perform the merge and commit the result. This option can be used to override --squash"
      "--no-verify": "This option bypasses the pre-merge and commit-msg hooks. See also githooks[5]"
      "-s, --strategy=": {description: "Use the given merge strategy; can be supplied more than once to specify them in the order they should be tried. If there is no -s option, a built-in list of strategies is used instead (git merge-recursive when merging a single head, git merge-octopus otherwise)", nargs: -1}
      "-X, --strategy-option=": "Pass merge strategy specific option through to the merge strategy"
      "--verify-signatures": "Verify that the tip commit of the side branch being merged is signed with a valid key, i.e. a key that has a valid uid: in the default trust model, this means the signing key has been signed by a trusted key. If the tip commit of the side branch is not signed with a valid key, the merge is aborted"
      "--no-verify-signatures": "Do not verify that the tip commit of the side branch being merged is signed with a valid key"
      "--summary": "Synonym to --stat ; this is deprecated and will be removed in the future"
      "--no-summary": "Synonym to --no-stat ; this is deprecated and will be removed in the future"
      "-q, --quiet": "Operate quietly. Implies --no-progress"
      "-v, --verbose": "Be verbose"
      "--autostash": "Automatically create a temporary stash entry before the operation begins, and apply it after the operation ends. This means that you can run the operation on a dirty worktree. However, use with care: the final stash application after a successful merge might result in non-trivial conflicts"
      "--no-autostash": "Do not automatically create a temporary stash entry before the operation begins, and apply it after the operation ends"
      "--allow-unrelated-histories": "By default, git merge command refuses to merge histories that do not share a common ancestor. This option can be used to override this safety when merging histories of two projects that started their lives independently. As that is a very rare occasion, no configuration variable to enable this by default exists and will not be added"
      "--all": "Fetch all remotes"
      "-a, --append": "Append ref names and object names of fetched refs to the existing contents of .git/FETCH_HEAD"
      "--atomic": "Use an atomic transaction to update local refs. Either all refs are updated, or on error, no refs are updated"
      "--depth?": "Limit fetching to the specified number of commits from the tip of each remote branch history"
      "--deepen?": "Similar to --depth, except it specifies the number of commits from the current shallow boundary instead of from the tip of each remote branch history"
      "--shallow-since?": "Deepen or shorten the history of a shallow repository to include all reachable commits after <date>"
      "--shallow-exclude?": "Deepen or shorten the history of a shallow repository to exclude commits reachable from a specified remote branch or tag. This option can be specified multiple times"
      "--unshallow": "If the source repository is shallow, fetch as much as possible so that the current repository has the same history as the source repository"
