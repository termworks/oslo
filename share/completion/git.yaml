        description: "Mark commits as bad"
        completion:
          positional:
            - ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
      - name: new
        description: "Mark commits as new"
        completion:
          positional:
            - ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
      - name: old
        description: "Mark commits as old"
        completion:
          positionalany: ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
      - name: good
        description: "Mark commits as good"
        completion:
          positionalany: ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
      - name: next
        description: "Find next bisection to test and check it out"
      - name: terms
        description: "Show the terms used for old and new commits (default: bad, good)"
        flags:
          "--term-old": "You can get just the old (respectively new) term"
          "--term-good": "You can get just the old (respectively new) term"
      - name: skip
        description: "Mark <rev>... untestable revisions"
        completion:
          positionalany: ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
      - name: reset
        description: "Finish bisection search and go back to commit"
        completion:
          positional:
            - ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
      - name: visualize
        aliases: [view]
        description: "See the currently remaining suspects in gitk"
      - name: replay
        description: "Replay bisection log"
        completion:
          positional:
            - ["$files"]
      - name: log
        description: "Show bisect log"
      - name: run
        description: "Use <cmd>... to automatically bisect"
      - name: help
  - name: grep
    description: "Print lines matching a pattern"
  - name: show
    description: "Show various types of objects"
    completion:
      positionalany: ["$revisions", "$files"]
  - name: branch
    description: "List, create, or delete branches"
    flags:
      "-a, --all": "List both remote-tracking and local branches"
      "-d, --delete=": {description: "Delete fully merged branch", nargs: -1}
      "-D=": {description: "Delete branch (even if not merged)", nargs: -1}
      "-m, --move=": {description: "Move/rename a branch and its reflog", nargs: 2}
      "-M=": {description: "Move/rename a branch, even if target exists", nargs: 2}
      "-c, --copy": "Copy a branch and its reflog"
      "-C": "Copy a branch, even if target exists"
      "-l, --list": "List branch names"
      "--create-reflog": "Create the branch's reflog"
      "--edit-description=": "Edit the description for the branch"
      "-f, --force": "Force creation, move/rename, deletion"
      "--merged=": "Print only branches that are merged"
      "--no-merged=": "Print only branches that are not merged"
      "--column": "List branches in columns [=<style>]"
      "--no-column": "Doesn't display branch listing in columns"
      "--sort=": "Field name to sort on"
      "--points-at=": "Print only branches of the object"
      "-i, --ignore-case": "Sorting and filtering are case insensitive"
      "--format=": "Format to use for the output"
      "-r, --remotes": "Lists or deletes (if used with -d) the remote-tracking branches"
      "--show-current": "Prints the name of the current branch"
      "-v, --verbose*": "Shows sha1 and commit subject line for each head, along with relationship to upstream branch when in list mode. If given twice, prints the path of the linked worktree and the name of the upstream branch"
      "-q, --quiet": "Suppress non-error messages"
      "--abbrev=": "Shows the shortest prefix that is at least <n> hexdigits long that uniquely refers the object"
      "--no-abbrev": "Displays the full sha1s in the output listing"
      "-t, --track=": "When creating a new branch, set up 'upstream' configuration"
      "--no-track=": "Do not set up 'upstream' configuration, even if the branch.autoSetupMerge configuration variable is true"
      "-u, --set-upstream-to?": "Sets branch to upstream provided"
      "--unset-upstream?": "Removes the upstream information"
      "--contains?": "Only lists branches which contain the specified commit"
      "--no-contains?": "Only lists branches which don't contain the specified commit"
      "--color?": "Color branches to highlight current, local, and remote-tracking branches"
      "--no-color": "Turns off branch colors"
    exclusiveflags:
      - [all, r, remotes]
      - [column, no-column]
      - [no-column, column]
      - [remotes, a, all]
      - [abbrev, no-abbrev]
      - [no-abbrev, abbrev]
      - [track, no-track]
      - [no-track, track, t]
      - [color, no-color]
      - [no-color, color]
    completion:
      positionalany: ["$branches"]
      flag:
        delete: ["-r\tDeletes the remote-tracking branches", "--remotes\tDeletes the remote-tracking branches"]
        D: ["-r\tDeletes the remote-tracking branches", "--remotes\tDeletes the remote-tracking branches"]
        color: [always, never, auto]
  - name: checkout
    description: "Switch branches or restore working tree files"
    flags:
      "-q, --quiet": "Quiet, suppress feedback messages"
      "--progress": "Progress status is reported on the standard error stream by default when it is attached to a terminal, unless --quiet is specified. This flag enables progress reporting even if not attached to a terminal, regardless of --quiet"
      "--no-progress": "Disable progress status reporting"
      "-f, --force": "When switching branches, proceed even if the index or the working tree differs from HEAD. This is used to throw away local changes"
      "-2, --ours": "When checking out paths from the index, check out stage #2 (ours) for unmerged paths"
      "-3, --theirs": "When checking out paths from the index, check out stage #3 (theirs) for unmerged paths"
      "-b=": "Create a new branch named <new_branch> and start it at <start_point>; see git-branch[1] for details"
      "-B=": "Creates the branch <new_branch> and start it at <start_point>; if it already exists, then reset it to <start_point>. This is equivalent to running 'git branch' with '-f'; see git-branch[1] for details"
      "-t, --track": "When creating a new branch, set up 'upstream' configuration"
      "--no-track": "Do not set up 'upstream' configuration, even if the branch.autoSetupMerge configuration variable is true"
      "--guess": "If <branch> is not found but there does exist a tracking branch in exactly one remote (call it <remote>) with a matching name, treat as equivalent to $ git checkout -b <branch> --track <remote>/<branch>"
      "--no-guess": "Disable --guess"
      "-l": "Create the new branch’s reflog; see git-branch[1] for details"
      "-d, --detach": "Rather than checking out a branch to work on it, check out a commit for inspection and discardable experiments. This is the default behavior of git checkout <commit> when <commit> is not a branch name"
      "--orphan=": "Create a new orphan branch, named <new_branch>, started from <start_point> and switch to it"
      "--ignore-skip-worktree-bits": "In sparse checkout mode, git checkout -- <paths> would update only entries matched by <paths> and sparse patterns in $GIT_DIR/info/sparse-checkout. This option ignores the sparse patterns and adds back any files in <paths>"
      "-m, --merge": "When switching branches, if you have local modifications to one or more files that are different between the current branch and the branch to which you are switching, the command refuses to switch branches in order to preserve your modifications in context"
      "--conflict?": "The same as --merge option above, but changes the way the conflicting hunks are presented, overriding the merge.conflictStyle configuration variable. Possible values are 'merge' (default) and 'diff3' (in addition to what is shown by 'merge' style, shows the original contents)"
      "-p, --patch": "Interactively select hunks in the difference between the <tree-ish> (or the index, if unspecified) and the working tree"
      "--ignore-other-worktrees": "Git checkout refuses when the wanted ref is already checked out by another worktree. This option makes it check the ref out anyway. In other words, the ref can be held by more than one worktree"
      "--overwrite-ignore": "Silently overwrite ignored files when switching branches. This is the default behavior"
      "--no-overwrite-ignore": "Use --no-overwrite-ignore to abort the operation when the new branch contains ignored files"
      "--recurse-submodules": "Using --recurse-submodules will update the content of all active submodules according to the commit recorded in the superproject. If local modifications in a submodule would be overwritten the checkout will fail unless -f is used. If nothing (or --no-recurse-submodules) is used, submodules working trees will not be updated. Just like git-submodule[1], this will detach HEAD of the submodule"
      "--no-recurse-submodules": "Submodules working trees will not be updated"
      "--overlay": "In the default overlay mode, git checkout never removes files from the index or the working tree"
      "--no-overlay": "When specifying --no-overlay, files that appear in the index and working tree, but not in <tree-ish> are removed, to make them match <tree-ish> exactly"
      "--pathspec-from-file=": "Pathspec is passed in <file> instead of commandline args"
      "--pathspec-file-nul": "Only meaningful with --pathspec-from-file"
    completion:
      flag:
        conflict: [merge, diff3]
        pathspec-from-file: ["$files"]
      positional:
        - ["-\tSwitch to the last used branch", "--\tDo not interpret more arguments as options", "$revisions"]
      positionalany: ["$files"]
  - name: cherry-pick
    description: "Apply the changes introduced by some existing commits"
    flags:
      "--continue": "Continue the operation in progress using the information in .git/sequencer"
      "--skip": "Skip the current commit and continue with the rest of the sequence"
      "--quit": "Forget about the current operation in progress"
      "--abort": "Cancel the operation and return to the pre-sequence state"
      "-e, --edit": "With this option, git cherry-pick will let you edit the commit message prior to committing"
      "--cleanup=": "This option determines how the commit message will be cleaned up before being passed on to the commit machinery"
      "-x": "When recording the commit, append a line that says \"(cherry picked from commit ...)\" to the original commit message in order to indicate which commit this change was cherry-picked from"
      "-m, --mainline=": "Specifies the parent number (starting from 1) of the mainline and allows cherry-pick to replay the change relative to the specified parent"
      "-n, --no-commit": "Applies changes necessary to cherry-pick each named commit to your working tree and the index without making any commit"
      "-s, --signoff": "Add a Signed-off-by trailer at the end of the commit message"
      "-S, --gpg-sign?": "GPG-sign commits"
      "--no-gpg-sign": "Useful to countermand both commit.gpgSign configuration variable, and earlier --gpg-sign"
      "--ff": "If the current HEAD is the same as the parent of the cherry-pick'ed commit, the a fast forward to this commit will be performed"
      "--allow-empty": "Allow empty commits to be preserved automatically in a cherry-pick"
      "--allow-empty-message": "Allow commits with empty messages to be cherry picked"
      "--keep-redundant-commits": "Creates an empty commit object. Implies --allow-empty"
      "--strategy=": "Use the given merge strategy. Should only be used once"
      "-X, --strategy-option=": "Pass the merge strategy-specific option through to the merge strategy"
      "--rerere-autoupdate": "Allow the rerere mechanism to update the index with the result of auto-conflict resolution if possible"
      "--no-rerere-autoupdate": "Do not allow the rerere mechanism to update the index with the result of auto-conflict resolution if possible"
    exclusiveflags:
      - [gpg-sign, no-gpg-sign]
      - [no-gpg-sign, S, gpg-sign]
      - [rerere-autoupdate, no-rerere-autoupdate]
      - [no-rerere-autoupdate, rerere-autoupdate]
    completion:
      positionalany: ["$revisions"]
      flag:
        cleanup: ["strip\tStrip leading and trailing empty lines, trailing whitepace, commentary and collapse consecutive empty lines", "whitespace\tSame as strip except #commentary is not removed", "verbatim\tDo not change the message at all", "scissors\tSame as whitespace except that everything from (and including) the line found below is truncated", "default\tSame as strip if the message is to be edited. Otherwise whitespace"]
        strategy: [resolve, recursive, octopus, ours, subtree]
        strategy-option: [ours, theirs, patience, diff-algorithm, "diff-algorithm=patience", "diff-algorithm=minimal", "diff-algorithm=histogram", "diff-algorithm=myers", ignore-space-change, ignore-all-space, ignore-space-at-eol, ignore-cr-at-eol, renormalize, no-renormalize, no-renames, find-renames, subtree]
  - name: submodule
    description: "Initialize, update or inspect submodules"
    flags:
      "-q, --quiet": "Only print error messages"
      "--cached": "The commit stored in the index is used instead"
    commands:
      - name: add
        description: "Add the given repository as a submodule at the given path to the changeset to be committed next to the current project"
        flags:
          "-b=": "Branch of repository to add as submodule"
          "-f, --force": "Allow adding an otherwise ignored submodule path"
          "--name=": "It sets the submodule’s name to the given string instead of defaulting to its path"
          "--reference=": "Remote repository to be cloned"
          "--depth=": "Create a shallow clone with a history truncated to the specified number of revisions"
          "--": "End of subcommand options"
        completion:
          positional:
            - []
            - ["$files"]
      - name: status
        description: "Show the status of the submodules"
        flags:
          "--cached": "Will instead print the SHA-1 recorded in the superproject for each submodule"
          "--recursive": "Will recurse into nested submodules, and show their status as well"
          "--": "End of subcommand options"
        completion:
          positionalany: ["$files"]
      - name: init
        description: "Initialize the submodules recorded in the index"
        flags:
          "--": "End of subcommand options"
        completion:
          positionalany: ["$files"]
      - name: deinit
        description: "Unregister the given submodules"
        flags:
          "-f, --force": "The submodule’s working tree will be removed even if it contains local modifications"
          "--all": "Unregister all submodules in the working tree"
          "--": "End of subcommand options"
        completion:
          positionalany: ["$files"]
      - name: update
        description: "Update the registered submodules to match what the superproject expects by cloning missing submodules, fetching missing commits in submodules and updating the working tree of the submodules"
        flags:
          "--init": "Initialize all submodules for which 'git submodule init' has not been called so far before updating"
          "--remote": "Instead of using the superproject’s recorded SHA-1 to update the submodule, use the status of the submodule’s remote-tracking branch"
          "-N, --no-fetch": "Don’t fetch new objects from the remote site"
          "--no-recommend-shallow": "Ignore the suggestions"
          "--recommend-shallow": "The initial clone of a submodule will use the recommended submodule.<name>.shallow as provided by the .gitmodules file"
          "-f, --force": "Throw away local changes in submodules when switching to a different commit; and always run a checkout operation in the submodule, even if the commit listed in the index of the containing repository matches the commit checked out in the submodule"
          "--checkout": "The commit recorded in the superproject will be checked out in the submodule on a detached HEAD"
          "--rebase": "The current branch of the submodule will be rebased onto the commit recorded in the superproject"
          "--merge": "The commit recorded in the superproject will be merged into the current branch in the submodule"
          "--reference=": "Remote repository"
          "--depth=": "Create a shallow clone with a history truncated to the specified number of revisions"
          "--recursive": "Traverse submodules recursively"
          "--jobs=": "Clone new submodules in parallel with as many jobs"
          "--single-branch": "Clone only one branch during update: HEAD or one specified by --branch"
          "--no-single-branch": "Don't clone only one branch during update: HEAD or one specified by --branch"
          "--": "End of subcommand options"
        completion:
          positionalany: ["$files"]
      - name: set-branch
        description: "Sets the default remote tracking branch for the submodule"
        flags:
          "-b, --branch=": "Branch of repository to add as submodule"
          "-d, --default": "Removes the submodule.<name>.branch configuration key, which causes the tracking branch to default to the remote HEAD"
          "--": "End of subcommand options"
        completion:
          positional:
            - ["$files"]
      - name: set-url
        description: "Sets the URL of the specified submodule to <newurl>"
        flags:
          "--": "End of command options"
        completion:
          positional:
            - ["$files"]
      - name: summary
        description: "Show commit summary between the given commit (defaults to HEAD) and working tree/index"
        flags:
          "--cached": "This command will recurse into the registered submodules, and sync any nested submodules within"
          "--files": "Show the series of commits in the submodule between the index of the super project and the working tree of the submodule"
          "-n=": "Limit the summary size (number of commits shown in total). Giving 0 will disable the summary; a negative number means unlimited (the default). This limit only applies to modified submodules. The size is always limited to 1 for added/deleted/typechanged submodules"
          "--summary-limit=": "Limit the summary size (number of commits shown in total). Giving 0 will disable the summary; a negative number means unlimited (the default). This limit only applies to modified submodules. The size is always limited to 1 for added/deleted/typechanged submodules"
          "--": "Everything after this is an argument"
        completion:
          positionalany: ["$files"]
      - name: foreach
        description: "Evaluates an arbitrary shell command in each checked out submodule"
        flags:
          "--recursive": "This command will recurse into the registered submodules, and sync any nested submodules within"
      - name: sync
        description: "Synchronizes submodules' remote URL configuration setting to the value specified in .gitmodules"
        flags:
          "--recursive": "This command will recurse into the registered submodules, and sync any nested submodules within"
          "--": "Everything after this is an argument"
        completion:
          positionalany: ["$files"]
      - name: absorbgitdirs
        description: "If a git directory of a submodule is inside the submodule, move the git directory of the submodule into its superproject’s $GIT_DIR/modules path and then connect the git directory and its working directory by setting the core.worktree and adding a .git file pointing to the git directory embedded in the superprojects git directory"
  - name: merge
    description: "Join two or more development histories together"
    flags:
      "--commit": "Perform the merge and commit the result. This option can be used to override --no-commit"
      "--no-commit": "Perform the merge and stop just before creating a merge commit, to give the user a chance to inspect and further tweak the merge result before committing"
      "--edit, -e": "Invoke an editor before committing successful mechanical merge to further edit the auto-generated merge message, so that the user can explain and justify the merge"
      "--no-edit": "The --no-edit option can be used to accept the auto-generated message (this is generally discouraged). The --edit (or -e) option is still useful if you are giving a draft message with the -m option from the command line and want to edit it in the editor"
      "--cleanup?": "This option determines how the merge message will be cleaned up before committing. See git-commit[1] for more details. In addition, if the <mode> is given a value of scissors, scissors will be appended to MERGE_MSG before being passed on to the commit machinery in the case of a merge conflict"
      "--ff": "When possible resolve the merge as a fast-forward (only update the branch pointer to match the merged branch; do not create a merge commit). When not possible (when the merged-in history is not a descendant of the current history), create a merge commit"
      "--no-ff": "Create a merge commit in all cases, even when the merge could instead be resolved as a fast-forward"
      "--ff-only": "Resolve the merge as a fast-forward when possible. When not possible, refuse to merge and exit with a non-zero status"
      "-S, --gpg-sign?": "GPG-sign the resulting merge commit. The keyid argument is optional and defaults to the committer identity; if specified, it must be stuck to the option without a space"
      "--no-gpg-sign": "Is useful to countermand both commit.gpgSign configuration variable, and earlier --gpg-sign"
      "--log?": "In addition to branch names, populate the log message with one-line descriptions from at most <n> actual commits that are being merged. See also git-fmt-merge-msg[1]"
      "--no-log": "Do not list one-line descriptions from the actual commits being merged"
      "--signoff": "Add a Signed-off-by trailer by the committer at the end of the commit log message. The meaning of a signoff depends on the project to which you’re committing. For example, it may certify that the committer has the rights to submit the work under the project’s license or agrees to some contributor representation, such as a Developer Certificate of Origin. (See http://developercertificate.org for the one used by the Linux kernel and Git projects.) Consult the documentation or leadership of the project to which you’re contributing to understand how the signoffs are used in that project"
      "--no-signoff": "Can be used to countermand an earlier --signoff option on the command line"
      "--stat": "Show a diffstat at the end of the merge. The diffstat is also controlled by the configuration option merge.stat"
      "-n, --no-stat": "Do not show a diffstat at the end of the merge"
      "--squash": "With --squash, --commit is not allowed, and will fail. Produce the working tree and index state as if a real merge happened (except for the merge information), but do not actually make a commit, move the HEAD, or record $GIT_DIR/MERGE_HEAD (to cause the next git commit command to create a merge commit). This allows you to create a single commit on top of the current branch whose effect is the same as merging another branch (or more in case of an octopus)"
      "--no-squash": "Perform the merge and commit the result. This option can be used to override --squash"
      "--no-verify": "This option bypasses the pre-merge and commit-msg hooks. See also githooks[5]"
      "-s, --strategy=": {description: "Use the given merge strategy; can be supplied more than once to specify them in the order they should be tried. If there is no -s option, a built-in list of strategies is used instead (git merge-recursive when merging a single head, git merge-octopus otherwise)", nargs: -1}
      "-X, --strategy-option=": "Pass merge strategy specific option through to the merge strategy"
      "--verify-signatures": "Verify that the tip commit of the side branch being merged is signed with a valid key, i.e. a key that has a valid uid: in the default trust model, this means the signing key has been signed by a trusted key. If the tip commit of the side branch is not signed with a valid key, the merge is aborted"
      "--no-verify-signatures": "Do not verify that the tip commit of the side branch being merged is signed with a valid key"
      "--summary": "Synonym to --stat ; this is deprecated and will be removed in the future"
      "--no-summary": "Synonym to --no-stat ; this is deprecated and will be removed in the future"
      "-q, --quiet": "Operate quietly. Implies --no-progress"
      "-v, --verbose": "Be verbose"
      "--progress": "Turn progress on/off explicitly. If neither is specified, progress is shown if standard error is connected to a terminal. Note that not all merge strategies may support progress reporting"
      "--no-progress": "Turn progress on/off explicitly. If neither is specified, progress is shown if standard error is connected to a terminal. Note that not all merge strategies may support progress reporting"
      "--autostash": "Automatically create a temporary stash entry before the operation begins, and apply it after the operation ends. This means that you can run the operation on a dirty worktree. However, use with care: the final stash application after a successful merge might result in non-trivial conflicts"
      "--no-autostash": "Do not automatically create a temporary stash entry before the operation begins, and apply it after the operation ends"
      "--allow-unrelated-histories": "By default, git merge command refuses to merge histories that do not share a common ancestor. This option can be used to override this safety when merging histories of two projects that started their lives independently. As that is a very rare occasion, no configuration variable to enable this by default exists and will not be added"
      "-m=": "Set the commit message to be used for the merge commit (in case one is created). If --log is specified, a shortlog of the commits being merged will be appended to the specified message. The git fmt-merge-msg command can be used to give a good default for automated git merge invocations. The automated message can include the branch description"
      "-F, --file=": "Read the commit message to be used for the merge commit (in case one is created). If --log is specified, a shortlog of the commits being merged will be appended to the specified message"
      "--rerere-autoupdate": "Allow the rerere mechanism to update the index with the result of auto-conflict resolution if possible"
      "--no-rerere-autoupdate": "Do not allow the rerere mechanism to update the index with the result of auto-conflict resolution if possible"
      "--overwrite-ignore": "Silently overwrite ignored files from the merge result. This is the default behavior. Use --no-overwrite-ignore to abort"
      "--no-overwrite-ignore": "Do not silently overwrite ignored files from the merge result"
      "--abort": "Abort the current conflict resolution process, and try to reconstruct the pre-merge state. If an autostash entry is present, apply it to the worktree. If there were uncommitted worktree changes present when the merge started, git merge --abort will in some cases be unable to reconstruct these changes. It is therefore recommended to always commit or stash your changes before running git merge. git merge --abort is equivalent to git reset --merge when MERGE_HEAD is present unless MERGE_AUTOSTASH is also present in which case git merge --abort applies the stash entry to the worktree whereas git reset --merge will save the stashed changes in the stash list"
      "--quit": "Forget about the current merge in progress. Leave the index and the working tree as-is. If MERGE_AUTOSTASH is present, the stash entry will be saved to the stash list"
      "--continue": "After a git merge stops due to conflicts you can conclude the merge by running git merge --continue (see 'HOW TO RESOLVE CONFLICTS' section below)"
    completion:
      flag:
        cleanup: [strip, whitespace, verbatim, scissors, default]
        strategy: [resolve, recursive, octopus, ours, subtree]
        strategy-option: [ours, theirs, patience, diff-algorithm, "diff-algorithm=patience", "diff-algorithm=minimal", "diff-algorithm=histogram", "diff-algorithm=myers", ignore-space-change, ignore-all-space, ignore-space-at-eol, ignore-cr-at-eol, renormalize, no-renormalize, no-renames, find-renames, subtree]
        file: ["$files"]
      positionalany: ["-\tShorthand for the previous branch", "$revisions"]
  - name: mergetool
    description: "Open the git tool to fix conflicts"
  - name: tag
    description: "Create, list, delete or verify a tag object signed with GPG"
    flags:
      "-l, --list": "List tag names"
      "-n=": "Print <n> lines of each tag message"
      "-d, --delete": "Delete tags"
      "-v, --verify": "Verify tags"
      "-a, --annotate": "Annotated tag, needs a message"
      "-m, --message=": "Tag message"
      "--points-at=": "List tags of the given object"
    completion:
      positionalany: ["$tags"]
      flag:
        n: [1, 2, 3]
        points-at: ["HEAD\tThe most recent commit", "HEAD~<N>\tA specific number of commits"]
  - name: restore
    description: "Restore working tree files"
    flags:
      "-s, --source=": "Restore the working tree files with the content from the given tree"
      "-p, --patch": "Interactively select hunks in the difference between the restore source and the restore location"
      "-W, --worktree": "Use the worktree as the restore location"
      "-S, --staged": "Use staging as the restore location"
      "-q, --quiet": "Quiet, suppress feedback messages"
      "--progress": "Progress status is reported on the standard error stream by default when it is attached to a terminal"
      "--no-progress": "Disable progress status reporting"
      "-2, --ours": "When restoring paths from the index, check out stage #2 (ours) for unmerged paths"
      "-3, --theirs": "When re out paths from the index, check out stage #3 (theirs) for unmerged paths"
      "-m, --merge": "When restoring files on the working tree from the index, recreate the conflicted merge in the unmerged paths"
      "--conflict=": "The same as --merge option, but changes the way the conflicting hunks are presented"
      "--ignore-unmerged": "When restoring files on the working tree from the index, do not abort the operation if there are unmerged entries"
      "--ignore-skip-worktree-bits": "In sparse checkout mode, by default is to only update entries matched by <pathspec> and sparse patterns in $GIT_DIR/info/sparse-checkout"
      "--recurse-submodules": "If <pathspec> names an active submodule and the restore location includes the working tree, the submodule will only be updated if this option is given, in which case its working tree will be restored to the commit recorded in the superproject, and any local modifications overwritten"
      "--no-recurse-submodules": "Submodules working trees will not be updated"
      "--overlay": "In overlay mode, the command never removes files when restoring"
      "--no-overlay": "In no-overlay mode, tracked files that do not appear in the --source tree are removed, to make them match <tree> exactly"
      "--pathspec-from-file=": "Pathspec is passed in <file> instead of commandline args. If <file> is exactly - then standard input is used"
      "--pathspec-file-nul": "Only meaningful with --pathspec-from-file. Pathspec elements are separated with NUL character and all other characters are taken literally (including newlines and quotes)"
      "--": "Do not interpret any more arguments as options"
    exclusiveflags:
      - [ours, theirs]
      - [theirs, ours]
      - [ignore-unmerged, ours, theirs, merge, conflict]
      - [recurse-submodules, no-recurse-submodules]
      - [no-recurse-submodules, recurse-submodules]
      - [overlay, no-overlay]
      - [no-overlay, overlay]
    completion:
      flag:
        source: ["$revisions"]
        conflict: [merge, diff3]
        pathspec-from-file: ["$files"]
  - name: switch
    description: "Switch branches"
    flags:
      "-c, --create=": "Create a new branch named <new-branch> starting at <start-point> before switching to the branch"
      "-C, --force-create=": "Similar to --create except that if <new-branch> already exists it will be reset to <start-point>"
      "-d, --detach": "Switch to a commit for inspection and discardable experiments"
      "--guess": "If <branch> is not found but there does exist a tracking branch in exactly one remote (call it <remote>) with a matching name"
      "--no-guess": "Disable --guess"
      "-f, --force": "An alias for --discard-changes"
      "--discard-changes": "Proceed even if the index or the working tree differs from HEAD. Both the index and working tree are restored to match the switching target"
      "-m, --merge": "If you have local modifications to one or more files that are different between the current branch and the branch to which you are switching, the command refuses to switch branches in order to preserve your modifications in context"
      "--conflict=": "The same as --merge option above, but changes the way the conflicting hunks are presented, overriding the merge.conflictStyle configuration variable"
      "-q, --quiet": "Quiet, suppress feedback messages"
      "--progress": "Progress status is reported on the standard error stream by default when it is attached to a terminal"
      "--no-progress": "Disable progress status reporting"
      "-t, --track=": "When creating a new branch, set up 'upstream' configuration"
      "--no-track=": "Do not set up 'upstream' configuration, even if the branch.autoSetupMerge configuration variable is true"
      "--orphan=": "Create a new orphan branch, named <new-branch>"
      "--ignore-other-worktrees": "Git switch refuses when the wanted ref is already checked out by another worktree"
      "--recurse-submodules": "Updates the content of all active submodules according to the commit recorded in the superproject"
      "--no-recurse-submodules": "Submodules working trees will not be updated"
    exclusiveflags:
      - [track, no-track]
      - [no-track, track, t]
      - [recurse-submodules, no-recurse-submodules]
      - [no-recurse-submodules, recurse-submodules]
    completion:
      flag:
        conflict: [merge, diff3]
      positional:
        - ["-\tSwitch to the last used branch", "$branches"]
  - name: worktree
    description: "Manage multiple working trees"
    commands:
      - name: add
        description: "Create <path> and checkout <commit-ish> into it"
        flags:
          "-f, --force": "By default, add refuses to create a new working tree when <commit-ish> is a branch name and is already checked out by another working tree, or if <path> is already assigned to some working tree but is missing (for instance, if <path> was deleted manually). This option overrides these safeguards. To add a missing but locked working tree path, specify --force twice"
          "-d, --detach": "With add, detach HEAD in the new working tree. See \"DETACHED HEAD\" in git-checkout[1]"
          "--checkout": "By default, add checks out <commit-ish>, however, --no-checkout can be used to suppress checkout in order to make customizations, such as configuring sparse-checkout. See \"Sparse checkout\" in git-read-tree[1]"
          "--lock": "Keep the working tree locked after creation. This is the equivalent of git worktree lock after git worktree add, but without a race condition"
          "-b, -B=": "With add, create a new branch named <new-branch> starting at <commit-ish>, and check out <new-branch> into the new working tree. If <commit-ish> is omitted, it defaults to HEAD. By default, -b refuses to create a new branch if it already exists. -B overrides this safeguard, resetting <new-branch> to <commit-ish>"
      - name: list
        description: "List details of each working tree"
        flags:
          "--porcelain": "With list, output in an easy-to-parse format for scripts. This format will remain stable across Git versions and regardless of user configuration. See below for details"
          "-v, --verbose": "With list, output additional information about worktrees (see below)"
          "--expire=": "With list, annotate missing working trees as prunable if they are older than <time>"
      - name: lock
        description: "If a working tree is on a portable device or network share which is not always mounted, lock it to prevent its administrative files from being pruned automatically"
        flags:
          "--reason=": "With lock or with add --lock, an explanation <reason> why the working tree is locked"
      - name: move
        description: "Move a working tree to a new location"
        flags:
          "-f, --force": "Move refuses to move a locked working tree unless --force is specified twice. If the destination is already assigned to some other working tree but is missing (for instance, if <new-path> was deleted manually), then --force allows the move to proceed; use --force twice if the destination is locked"
        completion:
          positional:
            - []
            - ["$files"]
      - name: prune
        description: "Prune working tree information in $GIT_DIR/worktrees"
        flags:
          "-n, --dry-run": "With prune, do not remove anything; just report what it would remove"
          "-v, --verbose": "With prune, report all removals"
          "--expire=": "With prune, only expire unused working trees older than <time>"
      - name: remove
        description: "Remove a working tree"
        flags:
          "-f, --force": "Remove refuses to remove an unclean working tree unless --force is used. To remove a locked working tree, specify --force twice"
      - name: repair
        description: "Repair working tree administrative files, if possible, if they have become corrupted or outdated due to external factors"
        completion:
          positional:
            - ["$files"]
      - name: unlock
        description: "Unlock a working tree, allowing it to be pruned, moved or deleted"
  - name: apply
    description: "Apply a patch to files and/or to the index"
    flags:
      "--exclude=": "Don't apply changes matching the given path"
      "--include=": "Apply changes matching the given path"
      "-p=": "Remove <num> leading slashes from traditional diff paths"
      "--no-add": "Ignore additions made by the patch"
      "--stat": "Instead of applying the patch, output diffstat for the input"
      "--numstat": "Show number of added and deleted lines in decimal notation"
      "--summary": "Instead of applying the patch, output a summary for the input"
      "--check": "Instead of applying the patch, see if the patch is applicable"
      "--index": "Make sure the patch is applicable to the current index"
      "-N, --intent-to-add": "Mark new files with `git add --intent-to-add`"
      "--cached": "Apply a patch without touching the working tree"
      "--unsafe-paths": "Accept a patch that touches outside the working area"
      "--apply": "Also apply the patch (use with --stat/--summary/--check)"
      "-3, --3way": "Attempt three-way merge if a patch does not apply"
      "--build-fake-ancestor=": "Build a temporary index based on embedded index information"
      "-z": "Paths are separated with NUL character"
      "-C=": "Ensure at least <n> lines of context match"
      "--whitespace=": "Detect new or modified lines that have whitespace errors"
      "--ignore-space-change, --ignore-whitespace": "Ignore changes in whitespace when finding context"
      "-R, --reverse": "Apply the patch in reverse"
      "--unidiff-zero": "Don't expect at least one line of context"
      "--reject": "Leave the rejected hunks in corresponding *.rej files"
      "--allow-overlap": "Allow overlapping hunks"
      "-v, --verbose": "Be verbose"
      "--inaccurate-eof": "Tolerate incorrectly detected missing new-line at the end of file"
      "--recount": "Do not trust the line counts in the hunk headers"
      "--directory=": "Prepend <root> to all filenames"
    completion:
      flag:
        whitespace: ["nowarn\tTurns off the trailing whitespace warning", "warn\tOutputs warnings for a few such errors, but applies the patch as-is (default)", "fix\tOutputs warnings for a few such errors, and applies the patch after fixing them", "error\tOutputs warnings for a few such errors, and refuses to apply the patch", "error-all\tSimilar to `error` but shows all errors"]
  - name: daemon
    description: "A really simple server for Git repositories"
    flags:
      "--strict-paths": "Match paths exactly (i.e. don’t allow \"/foo/repo\" when the real path is \"/foo/repo.git\" or \"/foo/repo/.git\") and don’t do user-relative paths. git daemon will refuse to start when this option is enabled and no whitelist is specified"
      "--base-path?": "Remap all the path requests as relative to the given path"
      "--base-path-relaxed": "If --base-path is enabled and repo lookup fails, with this option git daemon will attempt to lookup without prefixing the base path. This is useful for switching to --base-path usage, while still allowing the old paths"
      "--interpolated-path?": "To support virtual hosting, an interpolated path template can be used to dynamically construct alternate paths. The template supports %H for the target hostname as supplied by the client but converted to all lowercase, %CH for the canonical hostname, %IP for the server’s IP address, %P for the port number, and %D for the absolute path of the named repository. After interpolation, the path is validated against the directory whitelist"
      "--export-all": "Allow pulling from all directories that look like Git repositories (have the objects and refs subdirectories), even if they do not have the git-daemon-export-ok file"
      "--inetd": "Have the server run as an inetd service"
      "--listen?": "Listen on a specific IP address or hostname. IP addresses can be either an IPv4 address or an IPv6 address if supported. If IPv6 is not supported, then --listen=hostname is also not supported and --listen must be given an IPv4 address. Can be given more than once. Incompatible with --inetd option"
      "--port?": "Listen on an alternative port. Incompatible with --inetd option"
      "--init-timeout?": "Timeout (in seconds) between the moment the connection is established and the client request is received (typically a rather low value, since that should be basically immediate)"
      "--max-connections?": "Maximum number of concurrent clients, defaults to 32. Set it to zero for no limit"
      "--syslog": "Short for --log-destination=syslog"
      "--log-destination?": "Send log messages to the specified destination. Note that this option does not imply --verbose, thus by default only error conditions will be logged. The default destination is syslog if --inetd or --detach is specified, otherwise stderr"
      "--user-path?": "Allow ~user notation to be used in requests. When specified with no parameter, requests to git://host/~alice/foo is taken as a request to access foo repository in the home directory of user alice. If --user-path=some-path is specified, the same request is taken as a request to access the some-path/foo repository in the home directory of user alice"
      "--verbose": "Log details about the incoming connections and requested files"
      "--detach": "Detach from the shell. Implies --syslog"
      "--pid-file?": "Save the process id in the provided file"
      "--user?": "Change daemon’s uid and gid before entering the service loop. When only --user is given without --group, the primary group ID for the user is used. The values of the option are given to getpwnam(3) and getgrnam(3) and numeric IDs are not supported"
      "--group": "Change daemon’s gid before entering the service loop. The value of this option is given to getgrnam(3) and numeric IDs are not supported"
      "--enable?": "Enable the service site-wide per default"
      "--disable?": "Disable the service site-wide per default. Note that a service disabled site-wide can still be enabled per repository if it is marked overridable and the repository enables the service with a configuration item"
      "--allow-override?": "Allow overriding the site-wide default with per repository configuration. By default, all the services may be overridden"
      "--forbid-override?": "Forbid overriding the site-wide default with per repository configuration. By default, all the services may be overridden"
      "--informative-errors": "When informative errors are turned on, git-daemon will report more verbose errors to the client, differentiating conditions like \"no such repository\" from \"repository not exported\". This is more convenient for clients, but may leak information about the existence of unexported repositories. When informative errors are not enabled, all errors report \"access denied\" to the client"
      "--no-informative-errors": "Turn off informative errors. This option is the default. See --informative-errors for more information"
      "--access-hook?": "Every time a client connects, first run an external command specified by the <path> with service name (e.g. \"upload-pack\"), path to the repository, hostname (%H), canonical hostname (%CH), IP address (%IP), and TCP port (%P) as its command-line arguments. The external command can decide to decline the service by exiting with a non-zero status (or to allow it by exiting with a zero status). It can also look at the $REMOTE_ADDR and $REMOTE_PORT environment variables to learn about the requestor when making this decision. The external command can optionally write a single line to its standard output to be sent to the requestor as an error message when it declines the service"
    exclusiveflags:
      - [inetd, pid-file, user, group]
      - [pid-file, inetd]
      - [user, inetd]
      - [group, inetd]
      - [informative-errors, no-informative-errors]
      - [no-informative-errors, informative-errors]
    completion:
      flag:
        base-path: ["$directories"]
        log-destination: ["stderr\tWrite to standard error. Note that if --detach is specified, the process disconnects from the real standard error, making this destination effectively equivalent to none", "syslog\tWrite to syslog, using the git-daemon identifier", "none\tDisable all logging"]
        user-path: ["$directories"]
        pid-file: ["$files"]
        enable: ["upload-pack\tThis serves git fetch-pack and git ls-remote clients. It is enabled by default, but a repository can disable it by setting daemon.uploadpack configuration item to false", "upload-archive\tThis serves git archive --remote. It is disabled by default, but a repository can enable it by setting daemon.uploadarch configuration item to true", "receive-pack\tThis serves git send-pack clients, allowing anonymous push. It is disabled by default, as there is no authentication in the protocol (in other words, anybody can push anything into the repository, including removal of refs). This is solely meant for a closed LAN setting where everybody is friendly. This service can be enabled by setting daemon.receivepack configuration item to true"]
        disable: ["upload-pack\tThis serves git fetch-pack and git ls-remote clients. It is enabled by default, but a repository can disable it by setting daemon.uploadpack configuration item to false", "upload-archive\tThis serves git archive --remote. It is disabled by default, but a repository can enable it by setting daemon.uploadarch configuration item to true", "receive-pack\tThis serves git send-pack clients, allowing anonymous push. It is disabled by default, as there is no authentication in the protocol (in other words, anybody can push anything into the repository, including removal of refs). This is solely meant for a closed LAN setting where everybody is friendly. This service can be enabled by setting daemon.receivepack configuration item to true"]
        allow-override: ["upload-pack\tThis serves git fetch-pack and git ls-remote clients. It is enabled by default, but a repository can disable it by setting daemon.uploadpack configuration item to false", "upload-archive\tThis serves git archive --remote. It is disabled by default, but a repository can enable it by setting daemon.uploadarch configuration item to true", "receive-pack\tThis serves git send-pack clients, allowing anonymous push. It is disabled by default, as there is no authentication in the protocol (in other words, anybody can push anything into the repository, including removal of refs). This is solely meant for a closed LAN setting where everybody is friendly. This service can be enabled by setting daemon.receivepack configuration item to true"]
        forbid-override: ["upload-pack\tThis serves git fetch-pack and git ls-remote clients. It is enabled by default, but a repository can disable it by setting daemon.uploadpack configuration item to false", "upload-archive\tThis serves git archive --remote. It is disabled by default, but a repository can enable it by setting daemon.uploadarch configuration item to true", "receive-pack\tThis serves git send-pack clients, allowing anonymous push. It is disabled by default, as there is no authentication in the protocol (in other words, anybody can push anything into the repository, including removal of refs). This is solely meant for a closed LAN setting where everybody is friendly. This service can be enabled by setting daemon.receivepack configuration item to true"]
        access-hook: ["$files"]
