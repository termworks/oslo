  "-T, --syscall-times=": "Show the time spent in system calls."
  "-v, --no-abbrev": "Print unabbreviated versions of environment, stat, termios, etc."
  "--strings-in-hex=": "Control usage of escape sequences with hexadecimal numbers in the printed strings."
  "-X, --const-print-style=": "Set the format for printing of named constants and flags."
  "--always-show-pid": "Show PID prefix also for the process started by strace."
