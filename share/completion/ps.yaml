# Converted from Fig's ps.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: ps
description: "Report a snapshot of the current processes"
flags:
  "-A, -e": "Select all processes"
  "-a=": "Select all processes except both session leaders"
  "-d": "Select all processes except session leaders"
  "--deselect": "Select all processes except those that fulfill the specified conditions"
  "-N": "Select all processes except those that fulfill the specified conditions (negates the selection)"
  "-p, --pid=": "Select by process ID"
  "--ppid=": "Select by parent process ID. This selects the processes with a parent process ID in pidlist"
  "--sid=": "Select by session ID"
  "-t, --tty=": "Select by terminal"
  "-U=": "Select by real user ID (RUID) or name"
  "-u=": "Select by effective user ID (EUID) or name"
  "--User=": "Select by real user ID (RUID) or name"
  "--user=": "Select by effective user ID (EUID) or name"
  "-c": "Show different scheduler information for the -l option"
  "--context": "Display security context format (for SE Linux)"
  "-f": "Do full-format listing"
  "-F": "Extra full format"
  "--format, -o=*": ""
  "-M": "(for SE Linux)"
  "-y, -l": ""
  "--cols=": "Set screen width"
  "--columns=": "Set screen width"
  "--cumulative": "Include some dead child process data (as a sum with the parent)"
  "--forest": "ASCII art process tree"
  "-H": "Show process hierarchy (forest)"
  "--headers": "Repeat header lines, one per page of output"
  "-n=": "Set namelist file"
  "--lines=": "Set screen height"
  "--no-headers, --no-heading": "Print no header line at all"
  "--rows=": "Set screen height"
  "--sort=": "Specify sorting order"
  "--width=": "Set screen width"
  "-L": "Show threads, possibly with LWP and NLWP columns"
  "-T": "Show threads, possibly with SPID column"
  "--help": "Print a help message"
  "--info": "Print debugging info"
  "--version": "Print the procps version"
completion:
  flag:
    tty: ["$terminals"]
    U: ["$users"]
    u: ["$users"]
    pid: ["$pids"]
    ppid: ["$pids"]
    user: ["$users"]
    User: ["$users"]
