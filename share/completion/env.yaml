# Converted from Fig's env.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: env
description: "Set environment and execute command, or print environment"
flags:
  "-0": "End each output line with NUL, not newline"
  "-i, -": "Start with an empty environment"
  "-v": "Print verbose logs"
  "-u=": "Remove variable from the environment"
  "-P=": "Search the given directories for the utility, rather than the PATH"
  "-S=": "Split the given string into separate arguments"
completion:
  flag:
    P: ["$directories"]
  positionalany: ["$variables"]
