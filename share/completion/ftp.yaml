# Converted from argc's ftp.sh by tools/argc-to-spec. Do not edit by hand.
name: ftp
flags:
  "-4": "Forces tnftp to only use IPv4 addresses."
  "-6": "Forces tnftp to only use IPv6 addresses."
  "-A": "Force active mode FTP."
  "-a": "Causes tnftp to bypass normal login procedure, and use an anonymous login instead."
  "-d": "Enables debugging."
  "-e": "Disables command line editing."
  "-f": "Forces a cache reload for transfers that go through the FTP or HTTP proxies."
  "-g": "Disables file name globbing."
  "-i": "Turns off interactive prompting during multiple file transfers."
  "-N=": "Use netrc instead of ~/.netrc."
  "-n": "Restrains tnftp from attempting “auto-login” upon initial connection for non auto-fetch transfers."
  "-o=": "When auto-fetching files, save the contents in output."
  "-P=": "Sets the port number to port."
  "-p": "Enable passive mode operation for use behind connection filtering firewalls."
  "-q=": "Quit if the connection has stalled for quittime seconds."
  "-R": "Restart all non-proxied auto-fetches."
  "-r=": "Retry the connection attempt if it failed, pausing for wait seconds."
  "-s=": "Uses srcaddr as the local IP address for all connections."
  "-t": "Enables packet tracing."
  "-T=": "Set the maximum transfer rate for direction to maximum bytes/second, and if specified, the increment to increment bytes/second."
  "-u": "url file ... Upload files on the command line to url where url is one of the ‘ftp://’ URL types as supported by auto-fetch (with an optional target filename for single file uploads), and file is one or more local files to be uploaded."
  "-V": "Disable verbose and progress, overriding the default of enabled when output is to a terminal."
  "-v": "Enable verbose and progress."
  "-x=": "Set the size of the socket send and receive buffers to xfersize."
  "-?": "Display help to stdout, and exit."
  "-h, -help": "Print help"
  "-version": "Print version"
completion:
  positionalany: ["$hosts"]
