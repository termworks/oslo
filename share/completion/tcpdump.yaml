# Converted from argc's tcpdump.sh by tools/argc-to-spec. Do not edit by hand.
name: tcpdump
flags:
  "-A": "Print each packet (minus its link level header) in ASCII."
  "-b": "Print the AS number in BGP packets in ASDOT notation rather than ASPLAIN notation."
  "-B, --buffer-size=": "Set the operating system capture buffer size to buffer_size, in units of KiB (1024 bytes)."
  "-c=": "Exit after receiving count packets."
  "--count": "Print only on stdout the packet count when reading capture file(s) instead of parsing/printing the packets."
  "-C=": "Before writing a raw packet to a savefile, check whether the file is currently larger than file_size and, if so, close the current savefile and open a new one."
  "-d": "Dump the compiled packet-matching code in a human readable form to standard output and stop."
  "-dd": "Dump packet-matching code as a C program fragment."
  "-ddd": "Dump packet-matching code as decimal numbers (preceded with a count)."
  "-D, --list-interfaces": "Print the list of the network interfaces available on the system and on which tcpdump can capture packets."
  "-e": "Print the link-level header on each dump line."
  "-E": "Use spi@ipaddr algo:secret for decrypting IPsec ESP packets that are addressed to addr and contain Security Parameter Index value spi."
  "-f": "Print `foreign' IPv4 addresses numerically rather than symbolically (this option is intended to get around serious brain damage in Sun's NIS server — usually it hangs forever translating non-local internet numbers)."
  "-F=": "Use file as input for the filter expression."
  "-G=": "If specified, rotates the dump file specified with the -w option every rotate_seconds seconds."
  "-h, --help": "Print the tcpdump and libpcap version strings, print a usage message, and exit."
  "--version": "Print the tcpdump and libpcap version strings and exit."
  "-H": "Attempt to detect 802.11s draft mesh headers."
  "-i, --interface=": "Listen, report the list of link-layer types, report the list of time stamp types, or report the results of compiling a filter expression on interface."
  "-I, --monitor-mode": "Put the interface in \"monitor mode\"; this is supported only on IEEE 802.11 Wi-Fi interfaces, and supported only on some operating systems."
  "--immediate-mode": "Capture in \"immediate mode\"."
  "-j, --time-stamp-type=": "Set the time stamp type for the capture to tstamp_type."
  "-J, --list-time-stamp-types": "List the supported time stamp types for the interface and exit."
  "--time-stamp-precision=": "When capturing, set the time stamp precision for the capture to tstamp_precision."
  "--micro": "Shorthands for --time-stamp-precision=micro or --time-stamp-precision=nano, adjusting the time stamp precision accordingly."
  "--nano": "Shorthands for --time-stamp-precision=micro or --time-stamp-precision=nano, adjusting the time stamp precision accordingly."
  "-K, --dont-verify-checksums": "Don't attempt to verify IP, TCP, or UDP checksums."
  "-l": "Make stdout line buffered."
  "-L, --list-data-link-types": "List the known data link types for the interface, in the specified mode, and exit."
  "-m=": "Load SMI MIB module definitions from file module."
  "-M=": "Use secret as a shared secret for validating the digests found in TCP segments with the TCP-MD5 option (RFC 2385), if present."
  "-n": "Don't convert addresses (i.e., host addresses, port numbers, etc.) to names."
  "-N": "Don't print domain name qualification of host names."
  "-#, --number": "Print an optional packet number at the beginning of the line."
  "-O, --no-optimize": "Do not run the packet-matching code optimizer."
  "-p, --no-promiscuous-mode": "Don't put the interface into promiscuous mode."
  "--print": "Print parsed packet output, even if the raw packets are being saved to a file with the -w flag."
  "-Q, --direction=": "Choose send/receive direction direction for which packets should be captured."
  "-q": "Quick (quiet?) output."
  "-r=": "Read packets from file (which was created with the -w option or by other tools that write pcap or pcapng files)."
  "-S, --absolute-tcp-sequence-numbers": "Print absolute, rather than relative, TCP sequence numbers."
  "-s, --snapshot-length=": "Snarf snaplen bytes of data from each packet rather than the default of 262144 bytes."
  "-T=": "Force packets selected by \"expression\" to be interpreted the specified type."
  "-t": "Don't print a timestamp on each dump line."
  "-tt": "Print the timestamp, as seconds since January 1, 1970, 00:00:00, UTC, and fractions of a second since that time, on each dump line."
  "-ttt": "Print a delta (microsecond or nanosecond resolution depending on the --time-stamp-precision option) between current and previous line on each dump line."
  "-tttt": "Print a timestamp, as hours, minutes, seconds, and fractions of a second since midnight, preceded by the date, on each dump line."
  "-ttttt": "Print a delta (microsecond or nanosecond resolution depending on the --time-stamp-precision option) between current and first line on each dump line."
  "-u": "Print undecoded NFS handles."
  "-U, --packet-buffered": "If the -w option is not specified, or if it is specified but the --print flag is also specified, make the printed packet output ``packet-buffered''; i.e., as the description of the contents of each packet is printed, it will be written to the standard output, rather than, when not writing to a terminal, being written only when the output buffer fills."
  "-v": "When parsing and printing, produce (slightly more) verbose output."
  "-vv": "Even more verbose output."
  "-vvv": "Even more verbose output."
  "-V=": "Read a list of filenames from file."
  "-w=": "Write the raw packets to file rather than parsing and printing them out."
  "-W=": "Used in conjunction with the -C option, this will limit the number of files created to the specified number, and begin overwriting files from the beginning, thus creating a 'rotating' buffer."
  "-x": "When parsing and printing, in addition to printing the headers of each packet, print the data of each packet (minus its link level header) in hex."
  "-xx": "When parsing and printing, in addition to printing the headers of each packet, print the data of each packet, including its link level header, in hex."
  "-X": "When parsing and printing, in addition to printing the headers of each packet, print the data of each packet (minus its link level header) in hex and ASCII."
  "-XX": "When parsing and printing, in addition to printing the headers of each packet, print the data of each packet, including its link level header, in hex and ASCII."
  "-y, --linktype=": "Set the data link type to use while capturing packets (see -L) or just compiling and dumping packet-matching code (see -d) to datalinktype."
  "-z=": "Used in conjunction with the -C or -G options, this will make tcpdump run \" postrotate-command file \" where file is the savefile being closed after each rotation."
  "-Z, --relinquish-privileges=": "If tcpdump is running as root, after opening the capture device or input savefile, but before opening any savefiles for output, change the user ID to user and the group ID to the primary group of user."
completion:
  flag:
    interface: ["$interfaces"]
