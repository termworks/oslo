# Converted from Fig's sftp.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: sftp
description: "OpenSSH secure file transfer"
flags:
  "--help, -h": "Show help for sftp"
  "-4": "Forces scp to use IPv4 addresses only"
  "-6": "Forces scp to use IPv6 addresses only"
  "-A": "Allows forwarding of ssh-agent(1) to the remote system. The default is not to forward an authentication agent"
  "-a": "Attempt to continue interrupted transfers rather than overwriting existing partial or complete copies of files. If the partial contents differ from those being transferred, then the resultant file is likely to be corrupt"
  "-B=": "Specify the size of the buffer that sftp uses when transferring files. Larger buffers require fewer round trips at the cost of higher memory consumption. The default is 32768 bytes"
  "-b=": "Batch mode reads a series of commands from an input batchfile instead of stdin. Since it lacks user interaction it should be used in conjunction with non-interactive authentication to obviate the need to enter a password at connection time (see sshd(8) and ssh-keygen(1) for details)"
  "-C": "Compression enable. Passes the -C flag to ssh(1) to enable compression"
  "-c=": "Selects the cipher to use for encrypting the data transfer. This option is directly passed to ssh(1)"
  "-D=": "Connect directly to a local sftp server (rather than via ssh(1)). This option may be useful in debugging the client and server"
  "-F=": "Specifies an alternative per-user configuration file for ssh. This option is directly passed to ssh(1)"
  "-f": "Requests that files be flushed to disk immediately after transfer"
  "-i=": "Selects the file from which the identity (private key) for public key authentication is read. This option is directly passed to ssh(1)"
  "-J=": "Connect to the target host by first making an scp connection to the jump host described by destination and then establishing a TCP forwarding to the ultimate destination from there. Multiple jump hops may be specified separated by comma characters. This is a shortcut to specify a ProxyJump configuration directive. This option is directly passed to ssh(1)"
  "-l=": "Limits the used bandwidth, specified in Kbit/s"
  "-N": "Disables quiet mode, e.g. to override the implicit quiet mode set by the -b flag"
  "-o=": "Can be used to pass options to ssh in the format used in ssh_config(5). This is useful for specifying options for which there is no separate scp command-line flag. For full details of the options listed below, and their possible values, see ssh_config(5)"
  "-P=": "Specifies the port to connect to on the remote host. Note that this option is written with a capital ‘P’, because -p is already reserved for preserving the times and modes of the file"
  "-p": "Preserves modification times, access times, and modes from the original file"
  "-q": "Quiet mode: disables the progress meter as well as warning and diagnostic messages from ssh(1)"
  "-R=": "Specify how many requests may be outstanding at any one time. Increasing this may slightly improve file transfer speed but will increase memory usage. The default is 64 outstanding requests"
  "-r": "Recursively copy entire directories. Note that scp follows symbolic links encountered in the tree traversal"
  "-S=": "Name of program to use for the encrypted connection. The program must understand ssh(1) options"
  "-s=": "Specifies the SSH2 subsystem or the path for an sftp server on the remote host. A path is useful when the remote sshd(8) does not have an sftp subsystem configured"
  "-v": "Verbose mode. Causes scp and ssh(1) to print debugging messages about their progress. This is helpful in debugging connection, authentication, and configuration problems"
completion:
  flag:
    B: [32768]
    b: ["$files"]
    o: [AddressFamily, BatchMode, BindAddress, ChallengeResponseAuthentication, CheckHostIP, Cipher, Ciphers, ClearAllForwardings, Compression, CompressionLevel, ConnectionAttempts, ConnectTimeout, ControlMaster, ControlPath, ControlPersist, DynamicForward, EscapeChar, ExitOnForwardFailure, ForwardAgent, ForwardX11, ForwardX11Timeout, ForwardX11Trusted, GatewayPorts, GlobalKnownHostsFile, GSSAPIAuthentication, GSSAPIDelegateCredentials, HashKnownHosts, Host, HostbasedAuthentication, HostKeyAlgorithms, HostKeyAlias, HostName, IdentityFile, IdentitiesOnly, IPQoS, KbdInteractiveAuthentication, KbdInteractiveDevices, KexAlgorithms, LocalCommand, LocalForward, LogLevel, MACs, NoHostAuthenticationForLocalhost, NumberOfPasswordPrompts, PasswordAuthentication, PermitLocalCommand, PKCS11Provider, Port, PreferredAuthentications, Protocol, ProxyCommand, PubkeyAuthentication, RekeyLimit, RequestTTY, RhostsRSAAuthentication, RSAAuthentication, SendEnv, ServerAliveInterval, ServerAliveCountMax, StrictHostKeyChecking, TCPKeepAlive, Tunnel, TunnelDevice, UsePrivilegedPort, User, UserKnownHostsFile, VerifyHostKeyDNS, VisualHostKey, XAuthLocation]
    R: [64]
  positional:
    - ["$hosts"]
