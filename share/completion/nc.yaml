# Converted from Fig's nc.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: nc
description: "Arbitrary TCP and UDP connections and listens"
parsing: non-interspersed
flags:
  "-4?": "Forces nc to use IPv4 addresses only"
  "-6?": "Forces nc to use IPv6 addresses only"
  "-A?": "Set SO_RECV_ANYIF on socket"
  "-b=": "Specifies the interface to bind the socket to"
  "-c?": "Send CRLF as line-ending"
  "-D?": "Enable debugging on the socket"
  "-C?": "Force nc not to use cellular data context"
  "-d?": "Do not attempt to read from stdin"
  "-h?": "Prints out nc help"
  "-i=": "Specifies a delay time interval between lines of text sent and received"
  "-G=": "TCP connection timeout in seconds"
  "-H=": "Initial TCP keep alive timeout in seconds"
  "-I=": "Interval for repeating TCP keep alive timeout in seconds"
  "-J=": "Number of times to repeat TCP keep alive packets"
  "-k?": "Force nc to stay listening for another connection after its current connection is completed"
  "-l=": "Used to specify that nc should listen for an incoming connection rather than initiate a connection to a remote host"
  "-L=": "Number of prbes to send to the peer before declaring that the peer is not reachable"
  "-n?": "Do not do any DNS or service lookups on any specified addresses, hostnames or ports"
  "-p=": "Specifies the source port nc should use, subject to privilege restrictions and availability"
  "-r?": "Specifies that source and/or destination ports should be chosen randomly instead of sequentially within a range or in the order that the system assigns them"
  "-s=": "Specifies the IP of the interface which is used to send the packets"
  "-t?": "Causes nc to send RFC 854 DON'T and WON'T responses to RFC 854 DO and WILL requests"
  "-U?": "Specifies to use Unix Domain Sockets"
  "-u?": "Use UDP instead of the default option of TCP"
  "-v?": "Have nc give more verbose output"
  "-w=": "If a connection and stdin are idle for more than timeout seconds, then the connection is silently closed"
  "-X=": "Requests that nc should use the specified protocol when talking to the proxy server"
  "-x=": "Requests that nc should connect to hostname using a proxy at proxy_address and port"
  "-z?": "Specifies that nc should just scan for listening daemons, without sending any data to them"
  "--apple-delegate-pid?": "Requests that nc should delegate the socket for the specified PID"
  "--apple-delegate-uuid?": "Requests that nc should delegate the socket for the specified UUID"
  "--apple-ext-bk-idle?": "Requests that nc marks its socket for extended background idle time when the process becomes suspended"
  "--apple-nowakefromsleep?": "When the parameter n is greater than 0, requests that nc marks its socket to exlude the local port from the list of opened ports that is queried by drivers when the system goes to sleep args"
  "--ecn?": "Requests that nc marks to use the socket option TCP_ECN_MODE to set the ECN mode"
exclusiveflags:
  - [4, 6]
  - [6, 4]
  - [l, p, s, z, w]
  - [p, l]
  - [s, l]
  - [w, l]
  - [z, l]
completion:
  positionalany: ["$hosts"]
  flag:
    ecn: [default, enable, disable]
