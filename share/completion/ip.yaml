  "-h": "output statistics with human readable values followed by suffix."
  "-human": "output statistics with human readable values followed by suffix."
  "-human-readable": "output statistics with human readable values followed by suffix."
  "-b, -batch=": "Read commands from provided file or standard input and invoke them."
  "-force": "Don't terminate ip on errors in batch mode."
  "-s": "Output more information."
  "-stats": "Output more information."
  "-statistics": "Output more information."
  "-d, -details": "Output more detailed information."
  "-l, -loops=": "Specify maximum number of loops the 'ip address flush' logic will attempt before giving up."
  "-f, -family=": "Specifies the protocol family to use."
  "-4": "shortcut for -family inet."
  "-6": "shortcut for -family inet6."
  "-B": "shortcut for -family bridge."
  "-M": "shortcut for -family mpls."
  "-0": "shortcut for -family link."
  "-o, -oneline": "output each record on a single line, replacing line feeds with the '\\' character."
  "-r, -resolve": "use the system's name resolver to print DNS names instead of host addresses."
  "-n, -netns=": "switches ip to the specified network namespace NETNS."
  "-N, -Numeric": "Print the number of protocol, scope, dsfield, etc directly instead of converting it to human readable name."
  "-a, -all": "executes specified command over all objects, it depends if command supports this option."
  "-c=": ""
  "-t, -timestamp": "display current time when using monitor option."
  "-ts": "Like -timestamp, but use shorter format."
  "-tshort": "Like -timestamp, but use shorter format."
  "-rc=": "Set the netlink socket receive buffer size, defaults to 1MB."
  "-rcvbuf=": "Set the netlink socket receive buffer size, defaults to 1MB."
  "-iec": "print human readable rates in IEC units (e.g. 1Ki = 1024)."
  "-br": "Print only basic information in a tabular format for better readability."
  "-brief": "Print only basic information in a tabular format for better readability."
  "-j, -json": "Output results in JavaScript Object Notation (JSON)."
  "-p, -pretty": "The default JSON format is compact and more efficient to parse but hard for most users to read."
  "-help": "Print help"
  "-version": "Print version"
