name: nix-cache

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'termworks/oslo' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Check publishing credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          PIN_TOKEN: ${{ secrets.PIN_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ] || [ -z "$PIN_TOKEN" ]; then
            echo "::error::Add the ATTIC_TOKEN and PIN_TOKEN Actions secrets for cache.bresilla.com."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      - name: Build both packages and run their install checks
        run: |
          nix build --accept-flake-config --no-update-lock-file --print-build-logs \
            --no-link --print-out-paths .#oslo .#oslo-minimal \
            > "$RUNNER_TEMP/oslo-store-paths"
      - name: Collect store paths and pins
        id: release
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          cp "$RUNNER_TEMP/oslo-store-paths" "$RUNNER_TEMP/push-paths"
          for package in oslo oslo-minimal; do
            path=$(nix path-info --accept-flake-config --no-update-lock-file ".#$package")
            echo "$package-$SYSTEM $path" >> "$RUNNER_TEMP/push-pins"
          done
          { echo "paths<<EOF"; cat "$RUNNER_TEMP/push-paths"; echo EOF
            echo "pins<<EOF"; cat "$RUNNER_TEMP/push-pins"; echo EOF; } >> "$GITHUB_OUTPUT"
      # Only paths cache.nixos.org lacks; see bresilla/nixos .github/actions/attic-push.
      - uses: bresilla/nixos/.github/actions/attic-push@main
        with:
          paths: ${{ steps.release.outputs.paths }}
          pins: ${{ steps.release.outputs.pins }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          pin-token: ${{ secrets.PIN_TOKEN }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}

  verify-download:
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      - name: Download packages without local or remote builders
        run: |
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' --out-link result-oslo .#oslo
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' --out-link result-minimal .#oslo-minimal
          test "$(result-oslo/bin/oslo -c 'printf ok')" = ok
          test "$(result-minimal/bin/oslo-minimal -c 'printf ok')" = ok
