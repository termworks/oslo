name: nix-cache

on:
  push:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'termworks/oslo' &&
      (github.event_name == 'release' ||
       github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Check publishing credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Add a termworks cache write token as the CACHIX_AUTH_TOKEN Actions secret."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: termworks
          skipPush: true
      - name: Build both packages and run their install checks
        run: |
          nix build --accept-flake-config --no-update-lock-file --print-build-logs \
            --no-link --print-out-paths .#oslo .#oslo-minimal \
            > "$RUNNER_TEMP/oslo-store-paths"
      - name: Publish runtime closures
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push termworks < "$RUNNER_TEMP/oslo-store-paths"
      - name: Pin release packages
        if: github.event_name == 'release'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SYSTEM: ${{ matrix.system }}
        run: |
          for package in oslo oslo-minimal; do
            path=$(nix path-info --accept-flake-config --no-update-lock-file ".#$package")
            cachix pin termworks "$package-$GITHUB_REF_NAME-$SYSTEM" "$path"
          done

  verify-download:
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: termworks
          skipPush: true
      - name: Download packages without local or remote builders
        run: |
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' --out-link result-oslo .#oslo
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' --out-link result-minimal .#oslo-minimal
          test "$(result-oslo/bin/oslo -c 'printf ok')" = ok
          test "$(result-minimal/bin/oslo-minimal -c 'printf ok')" = ok
